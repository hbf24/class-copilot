<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Copilot · 课堂复现</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1a1d29;--sub:#6b7280;--acc:#4f46e5;--acc2:#eef2ff;--ok:#059669;--warn:#d97706;--err:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:none;margin:0 auto;padding:10px 26px 14px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
header h1{font-size:20px}
.crumbs{color:var(--sub);font-size:13px;margin-bottom:10px;cursor:pointer}
.crumbs:hover{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:9px;padding:7px 14px;font-size:13.5px;cursor:pointer;background:var(--acc2);color:var(--acc);font-weight:600;transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--acc);color:#fff}
.btn.danger{background:#fef2f2;color:var(--err)}
.btn.warnb{background:#fffbeb;color:var(--warn)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
.btn.on{background:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.newrow{display:flex;gap:10px;margin-bottom:20px}
.newrow input[type=text]{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px}
.newrow select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;max-width:240px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.narrowlist{display:flex;flex-direction:column;gap:4px}
.narrowitem{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;transition:.12s}
.narrowitem:hover{border-color:var(--acc);background:var(--acc2)}
.narrowitem .nvthumb{width:44px;height:30px;border-radius:6px;background-size:cover;background-position:center;flex-shrink:0;border:1px solid var(--line);background-color:#e9edf7}
.narrowitem .nvbody{flex:1;min-width:0}
.narrowitem .nvtitle{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narrowitem .nvmeta{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narrowitem .nvacts{display:flex;gap:4px;flex-shrink:0}
.narrowitem .nvacts .btn{padding:3px 8px;font-size:11.5px}
.viewtoggle{display:inline-flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px}
.viewtoggle button{border:none;background:transparent;padding:4px 6px;cursor:pointer;border-radius:6px;font-size:14px;line-height:1;opacity:.55}
.viewtoggle button.on{background:var(--acc);color:#fff;opacity:1}
.course{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:16/9;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;cursor:pointer;padding:0;background-color:#e9edf7;background-size:cover;background-position:center;transition:.15s}
.course:hover{border-color:var(--acc);box-shadow:0 6px 22px rgba(15,23,42,.18)}
.course::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0) 30%,rgba(15,23,42,.78) 100%);pointer-events:none}
.course .ccin{position:relative;z-index:1;padding:11px 14px;color:#fff;min-width:0}
.course h3{font-size:15.5px;margin-bottom:5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course .meta{color:rgba(255,255,255,.9);font-size:12px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course .gbadge{background:rgba(255,255,255,.22);color:#fff}
.course .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.course .acts .btn{padding:3px 9px;font-size:11.5px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.course .acts .btn.danger{background:rgba(220,38,38,.35);color:#fff}
.course .acts .btn:hover{filter:brightness(1.15)}
.cvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cvsw{height:62px;border-radius:9px;cursor:pointer;border:2px solid transparent;position:relative;background-size:cover;background-position:center}
.cvsw.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.cvsw span{position:absolute;left:6px;bottom:5px;font-size:11px;color:#fff;background:rgba(0,0,0,.38);padding:1px 6px;border-radius:6px}
.pagebg{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:12.5px;color:var(--sub)}
.pagebg input[type=range]{width:92px}
/* 预览内容透明度: 只作用于预览内容本身, 课堂背景图不受影响 */
.pvop{display:inline-flex;align-items:center;gap:6px;flex:none;background:#fff;border:1px solid var(--line);border-radius:9px;padding:2px 9px;font-size:12px;color:var(--sub)}
.pvop input[type=range]{width:76px;margin:0}
body.hasbgimg .minirow .pvop{background:rgba(255,255,255,.78);border-color:rgba(15,23,42,.42);color:var(--ink);backdrop-filter:blur(4px)}
/* 页面底图: 内容面板加半透明白蒙层(比空白区域浅一档), PPT 展示区保持不透明 */
body.hasbgimg .card{background:rgba(255,255,255,.8)}
body.hasbgimg .pptcol{background:#eceef3}
/* 笔记编辑器本身不再叠第二层白: 它已经在 .card 蒙层里, 再叠 .74 会让笔记栏比原稿/总结栏更白 */
body.hasbgimg .ncm{background:transparent;border-radius:10px}
body.hasbgimg .cm-editor,body.hasbgimg .cm-scroller,body.hasbgimg .cm-content,body.hasbgimg .cm-gutters{background:transparent!important}
/* 讲稿卡片的小标题也不叠第二层白, 让「原稿/总结」与笔记栏是同一档面板蒙层 */
body.hasbgimg .pgscript h4{background:transparent}
/* 底图上浮控件统一规则: 浅白色半透明底衬 + 深色描边 + 深色文字,
   保证任意底图明暗、5 档蒙层下都读得清(面包屑/返回、顶部按钮、工具栏、页签、下拉等) */
body.hasbgimg .crumbs{display:inline-block;background:rgba(255,255,255,.76);border:1px solid rgba(15,23,42,.38);border-radius:8px;padding:3px 10px;color:var(--ink);backdrop-filter:blur(4px)}
/* 底图上直接压着的标题/说明文字: 与按钮同一套底衬, 避免深色底图上文字被吞 */
body.hasbgimg header>h1,
body.hasbgimg header>.hint{background:rgba(255,255,255,.78);border:1px solid rgba(15,23,42,.42);border-radius:8px;padding:3px 10px;color:var(--ink);backdrop-filter:blur(4px)}
body.hasbgimg header .btn,
body.hasbgimg header .pagebg,
body.hasbgimg .tabs .btn,
body.hasbgimg .minirow .btn,
body.hasbgimg .minirow a.btn,
body.hasbgimg .newrow .btn,
body.hasbgimg .newrow select{background:rgba(255,255,255,.78);border:1px solid rgba(15,23,42,.42);color:var(--ink);backdrop-filter:blur(4px)}
body.hasbgimg header .btn.primary,
body.hasbgimg .tabs .btn.on{background:rgba(79,70,229,.92);border-color:rgba(15,23,42,.5);color:#fff}
body.hasbgimg .course .acts .btn{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.55)}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600}
.gbadge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600}
.modalwrap{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modalbox{background:#fff;border-radius:14px;padding:20px;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.modalbox h3{font-size:16px;margin-bottom:8px}
.modalbox p{color:var(--sub);font-size:13px;line-height:1.6;margin-bottom:10px}
.modalbox label.opt{display:block;margin:7px 0;font-size:13.5px;cursor:pointer}
.modalbox select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin:8px 0 14px;background:#fff}
.modalbox .row{display:flex;gap:10px;justify-content:flex-end}
.homesec{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin:0 0 10px;font-size:14px;font-weight:700;color:var(--acc);cursor:pointer;user-select:none;transition:.15s}
.homesec:hover{border-color:var(--acc)}
.homesec .cnt{background:var(--acc2);color:var(--acc);font-size:12px;padding:1px 8px;border-radius:99px}
.homesec .arrow{margin-left:auto;color:var(--sub);font-weight:400;font-size:12px}
.homesec.collapsed{border-style:dashed;color:var(--sub)}
.b-ready{background:#f3f4f6;color:var(--sub)} .b-rec{background:#fef2f2;color:var(--err)}
.b-proc{background:#fffbeb;color:var(--warn)} .b-done{background:#ecfdf5;color:var(--ok)}
.b-err{background:#fef2f2;color:var(--err)}
.termstrip{display:flex;flex-wrap:wrap;gap:5px;overflow:hidden;max-height:24px;transition:max-height .2s}
.termstrip.open{max-height:200px}
.termstrip span{background:var(--acc2);color:var(--acc);font-size:11.5px;padding:2px 9px;border-radius:99px;white-space:nowrap}
/* 三栏状态名 = 可见栏的左右顺序(l 转写 / c 预览 / r 笔记), n 为全部收起。
   三开 1:2:1, 两开对半, 单开占满; 具体比例仍可被分隔条拖拽覆盖并分别记住。 */
.cols,#dgrid{display:grid;gap:14px;align-items:stretch;position:relative}
.cols.lcr{grid-template-columns:minmax(220px,1fr) minmax(0,2fr) minmax(220px,1fr)}
.cols.lc,.cols.lr,.cols.cr{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols.l,.cols.c,.cols.r,.cols.n{grid-template-columns:minmax(0,1fr)}
#dgrid.lr{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#dgrid.l,#dgrid.r,#dgrid.n{grid-template-columns:minmax(0,1fr)}
@media(max-width:1100px){.foldstrip{display:none}}
@media(max-width:900px){.cols.lcr,.cols.lc,.cols.lr,.cols.cr{grid-template-columns:1fr!important}}
/* 栏宽拖拽: 分割条覆盖在两栏间隙上, 悬停显示竖线光标与高亮 */
.colsplit{position:absolute;top:0;width:10px;transform:translateX(-50%);cursor:col-resize;z-index:6;touch-action:none}
.colsplit::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;border-radius:2px;background:rgba(79,70,229,.2);transition:.12s}
.colsplit:hover::before,.colsplit.drag::before{background:var(--acc);box-shadow:0 0 0 2px rgba(79,70,229,.14)}
@media(max-width:900px){.colsplit{display:none!important}}
/* 贴边小箭头: 用 fixed 锁死在屏幕左右/下边缘, 不随可见栏的边界移动,
   避免某栏折叠后另一栏撑满时按钮看起来贴在那一栏边上造成混淆 */
.edgebtn{position:fixed;z-index:110;display:flex;align-items:center;justify-content:center;border:1px solid rgba(15,23,42,.32);background:rgba(255,255,255,.88);color:var(--acc);font-size:11px;line-height:1;cursor:pointer;user-select:none;padding:0;box-shadow:0 2px 8px rgba(15,23,42,.14);backdrop-filter:blur(4px)}
.edgebtn:hover{background:#fff;border-color:var(--acc);color:var(--acc)}
.edgebtn.fold-l,.edgebtn.expand-l{left:0;top:50%;width:16px;height:38px;transform:translateY(-50%);border-radius:0 7px 7px 0}
.edgebtn.fold-r,.edgebtn.expand-r{right:0;top:50%;width:16px;height:38px;transform:translateY(-50%);border-radius:7px 0 0 7px}
.edgebtn.expand-c{left:50%;bottom:0;width:38px;height:16px;transform:translateX(-50%);border-radius:7px 7px 0 0}
.edgebtn:disabled{opacity:.5}
/* 全折叠时只留纯净背景: 占位元素完全透明, 不写字、不画框 */
.colempty{display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:transparent;font-size:0;pointer-events:none}
/* 纯净背景模式: 所有栏都收起后点一下背景, 页面上所有按钮都消失(只留能展开栏的贴边箭头),
   画面只剩背景; 再点背景恢复, 展开任意一栏也会自动恢复 */
body.pure button:not(.edgebtn),body.pure a.btn{display:none!important}
/* 纯净模式: 连面包屑/标题/背景控制/录音计数等非按钮控件也一起藏掉, 只剩背景 + 展开箭头 */
body.pure .crumbs,body.pure .crumbsrow,body.pure header,body.pure .minirow,
body.pure .bgwrap,body.pure .tabs,body.pure #acount,body.pure .tabsbar,
body.pure .sesshead,body.pure .toolbar,body.pure .livebar,
body.pure .termstrip{visibility:hidden!important}
/* 纯净模式: 内容藏掉后, 外层卡片自己的白底和内边距还会剩一条空壳,
   把它和状态横幅一起藏掉, 画面才只剩背景 */
body.pure .card,body.pure #banner{display:none!important}
/* 预览栏折叠按钮: 骑在预览栏上边缘的小标签, 不与栏眉按钮挤在一起 */
#colC{position:relative}
.pvf{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:44px;height:18px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;border-radius:0 0 8px 8px;z-index:8;background:rgba(255,255,255,.92);border:1px solid rgba(15,23,42,.32);border-top:0;color:var(--acc);cursor:pointer;user-select:none}
.pvf:hover{background:#fff;border-color:var(--acc)}
/* 面包屑行: 背景深浅滑块靠最右, 与下方按钮行的右边缘对齐 */
.crumbsrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
.crumbsrow .crumbs{margin-bottom:0;flex:none}
.crumbsrow .bgshade{margin-left:auto}
/* 连续背景深浅滑块(页眉右侧) */
.bgshade{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px 10px;font-size:12px;color:var(--sub);white-space:nowrap;flex:none}
.bgshade input[type=range]{width:112px;margin:0}
.bgshade .bgsv{min-width:36px;text-align:right}
body.hasbgimg .bgshade{background:rgba(255,255,255,.82);border-color:rgba(15,23,42,.42);color:var(--ink);backdrop-filter:blur(4px)}
/* 轻提示 toast */
#cctoast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(10px);background:rgba(17,24,39,.94);color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;line-height:1.4;z-index:1200;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:80vw}
#cctoast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pptcol{max-height:calc(100vh - 212px);overflow:auto;background:#eceef3;border-radius:12px;padding:10px 16px 10px 10px;cursor:grab;scrollbar-gutter:stable;user-select:none;min-width:0;overscroll-behavior:contain}
.pptcol.panning{cursor:grabbing}
.pptcol.ocr-mode{cursor:crosshair}
.pptcol.ocr-mode img{cursor:crosshair}
.pptcol img{width:100%;display:block;box-shadow:0 1px 6px rgba(0,0,0,.15);border-radius:4px;background:#fff;-webkit-user-drag:none;user-select:none}
#pgviewer{position:fixed;inset:0;background:rgba(8,9,14,.93);z-index:200;overflow:hidden;cursor:grab}
#pgviewer img{position:absolute;top:0;left:0;transform-origin:0 0;-webkit-user-drag:none}
#pgviewer .vbar{position:fixed;top:14px;right:16px;display:flex;gap:8px;align-items:center;background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 2px 12px rgba(0,0,0,.3);font-size:13px;font-weight:600}
#pgviewer .vbar button{border:none;background:var(--acc2);color:var(--acc);border-radius:99px;padding:4px 12px;cursor:pointer;font-weight:600}

.pptgrid{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;align-items:flex-start;--pw:100%}
.pptgrid .pcell{flex:0 0 var(--pw,100%);min-width:0}
.pptgrid .pcell img{margin-bottom:4px}
.pptgrid .pgno{text-align:center;font-size:11px;color:var(--sub);margin:-2px 0 8px}
.pptcol .pgno{text-align:center;font-size:11px;color:var(--sub);margin:0 0 12px}
.pptcol .pgno a{color:var(--acc);cursor:pointer;margin-left:6px;text-decoration:none;font-weight:600}
/* 文件库 / 通用预览 */
.pptcol.textmode{cursor:auto;user-select:text;background:#fff}
.filetext{padding:6px 4px;font-size:14px;line-height:1.85;overflow-wrap:break-word}
.filetext pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;margin:0}
.filemedia{padding:18px 10px;text-align:center}
.filemedia audio,.filemedia video{width:100%;max-width:760px;border-radius:10px;background:#0f172a}
.fileunsupported{text-align:center;padding:40px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.filebox{width:min(780px,100%)}
.ftable{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.frow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.frow:last-child{border-bottom:none}
.frow.cur{background:var(--acc2)}
.frow.pick{cursor:pointer}
.frow.pick:hover{background:#f3f4f6}
.frow.pick.cur{background:var(--acc2)}
.frow.pick.cur .fname{color:var(--acc)}
.fic{font-size:16px;flex:none}
.fname{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ftag{font-style:normal;font-size:10.5px;background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.ftag.cf{background:#ecfdf5;color:var(--ok)}
.cfuse{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-bottom:8px;cursor:pointer}
.cfuse input{accent-color:var(--acc)}
/* 课程文件弹窗: 左列表 + 右预览, 复用课堂预览器 */
.cfbox{width:min(1100px,96vw);padding:16px}
.cfbody{display:flex;gap:12px;align-items:stretch;min-height:0}
.cflist{flex:0 0 330px;max-height:calc(100vh - 280px);overflow:auto;border:1px solid var(--line);border-radius:10px}
.cfprev{flex:1;min-width:0;max-height:calc(100vh - 280px)}
@media(max-width:820px){.cfbody{flex-direction:column}.cflist{flex:none;max-height:220px}}
.fmeta{color:var(--sub);font-size:11.5px;flex:none;white-space:nowrap}
.facts{display:flex;gap:4px;flex:none}
.facts .btn{padding:3px 9px;font-size:11.5px}
@media(max-width:720px){.fmeta{display:none}}
.sidebox{max-height:calc(100vh - 320px);overflow-y:auto}
.capbox{max-height:30vh;overflow-y:auto;font-size:13px;line-height:1.75;color:#374151}
.capbox p{margin:4px 0}
.md{font-size:14px;line-height:1.85;overflow-wrap:break-word}
.md h1{font-size:19px;margin:14px 0 10px}.md h2{font-size:16.5px;margin:16px 0 8px;color:var(--acc)}
.md h3{font-size:14.5px;margin:13px 0 6px}.md ul{margin:4px 0 10px 20px}
.md li{margin:3px 0}
.tree{font-size:13px;line-height:1.9}
.tree ul{margin-left:16px;padding-left:10px;border-left:1.5px solid #d9dcef;list-style:none}
.tree>ul{border-left:none;margin-left:0}
.tree li{position:relative;padding-left:14px}
.tree li::before{content:"";position:absolute;left:-10px;top:.95em;width:10px;height:1.5px;background:#d9dcef}
.tree .root{font-weight:700;color:var(--acc);font-size:14.5px}

<script>
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const statusBadge = st => ({
  ready:'<span class="badge b-ready">未上课</span>', recording:'<span class="badge b-rec">录音中</span>',
  transcribing:'<span class="badge b-proc">转写中</span>', organizing:'<span class="badge b-proc">AI整理中</span>',
  recorded:'<span class="badge b-ready">已转写·待整理</span>',
  done:'<span class="badge b-done">已完成</span>', error:'<span class="badge b-err">出错</span>'
}[st] || `<span class="badge b-ready">${esc(st)}</span>`);
const fmtDur = s => `${Math.floor((s||0)/60)}分钟`;
const fmtMMSS = s => { s = Math.max(0, Math.floor(s||0)); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };

// ---------- 栏宽拖拽(上课页三栏 / 课堂页两栏) ----------
// 折叠状态与栏宽按课堂独立记忆; 新 key 首次出现时, 把旧的全局值迁过来一次(不删旧值, 便于回退)
function ccClassKey(newKey, legacyKey){
  try{
    if(localStorage.getItem(newKey) === null){
      const old = localStorage.getItem(legacyKey);
      if(old !== null) localStorage.setItem(newKey, old);
    }
  }catch(e){}
  return newKey;
}
const COL_FITTERS = new Set();
window.addEventListener("resize", ()=>{ for(const f of [...COL_FITTERS]) f(); });
function colLoad(key, fallback){
  try{ const v = JSON.parse(localStorage.getItem(key)||"null");
    return v && typeof v==="object" ? v : fallback; }catch(e){ return fallback; }
}
function colSave(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function colApply(container, items, fracs, mins){
  if(!container || !items.length) return;
  container.style.gridTemplateColumns = items.map((el,i)=>
    `minmax(${mins[i]||0}px, ${Math.max(0.01, Number(fracs[i])||0)}fr)`).join(" ");
}
function colFracs(container, items){
  const gap = parseFloat(getComputedStyle(container).columnGap) || 0;
  const total = Math.max(1, container.clientWidth - gap*(items.length-1));
  return items.map(el => +((el.getBoundingClientRect().width||0)/total).toFixed(4));
}
function setupColDrag(container, opts){
  if(!container) return null;
  let handles = [];
  const gapPx = () => parseFloat(getComputedStyle(container).columnGap) || 0;
  const itemsNow = () => opts.items().filter(el=>el && el.isConnected && getComputedStyle(el).display!=="none");
  const stateNow = () => opts.state();
  function fracsFor(st, n){
    const saved = colLoad(opts.key, {})[st];
    return (Array.isArray(saved) && saved.length===n) ? saved.slice() : opts.defaults[st].slice();
  }
  function apply(){
    const items = itemsNow(); if(!items.length) return;
    colApply(container, items, fracsFor(stateNow(), items.length), opts.mins[stateNow()]);
  }
  function position(){
    if(!container.isConnected) return;
    const cr = container.getBoundingClientRect(), items = itemsNow();
    handles.forEach((h,i)=>{
      const it = items[i];
      if(!it){ h.style.display = "none"; return; }
      h.style.display = "";
      h.style.left = (it.getBoundingClientRect().right - cr.left + gapPx()/2) + "px";
      h.style.height = container.clientHeight + "px";
    });
  }
  function build(){
    handles.forEach(h=>h.remove()); handles = [];
    if(window.innerWidth <= 900) return;
    const items = itemsNow(); if(items.length < 2) return;
    items.slice(0, -1).forEach((it,i)=>{
      const h = document.createElement("div");
      h.className = "colsplit"; h.dataset.split = String(i);
      h.title = "拖动调整两栏宽度 · 双击恢复默认比例";
      h.addEventListener("pointerdown", ev=>start(ev, h, i, items));
      h.addEventListener("dblclick", ev=>{ ev.preventDefault(); reset(); });
      container.appendChild(h); handles.push(h);
    });
    position();
  }
  function start(ev, h, i, items){
    ev.preventDefault();
    try{ h.setPointerCapture(ev.pointerId); }catch(e){}
    h.classList.add("drag");
    const total = Math.max(1, container.clientWidth - gapPx()*(items.length-1));
    const ws = items.map(el=>el.getBoundingClientRect().width);
    const pair = ws[i] + ws[i+1], a0 = ws[i], x0 = ev.clientX;
    const mins = opts.mins[stateNow()] || [];
    const move = me=>{
      let a = a0 + (me.clientX - x0);
      a = Math.max(mins[i]||0, Math.min(pair-(mins[i+1]||0), a));
      ws[i] = a; ws[i+1] = pair - a;
      colApply(container, items, ws.map(w=>w/total), opts.mins[stateNow()]);
      position();
    };
    const up = ()=>{
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      h.classList.remove("drag");
      document.body.style.userSelect = ""; document.body.style.cursor = "";
      const store = colLoad(opts.key, {});
      store[stateNow()] = colFracs(container, items);
      colSave(opts.key, store);
    };
    document.body.style.userSelect = "none"; document.body.style.cursor = "col-resize";
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  }
  function reset(){
    const store = colLoad(opts.key, {});
    delete store[stateNow()];
    colSave(opts.key, store);
    apply(); position();
  }
  function resetAll(){
    try{ localStorage.removeItem(opts.key); }catch(e){}
    apply(); position();
  }
  const fit = ()=>{
    if(!container.isConnected){ COL_FITTERS.delete(fit); return; }
    apply(); build();
  };
  COL_FITTERS.add(fit);
  apply(); build();
  return {apply, build, position, reset, resetAll};
}

function md(t){
  if(!t) return "";
  const lines = esc(t).split("\n"); let out=[], inUl=false;
  const closeUl = ()=>{ if(inUl){out.push("</ul>"); inUl=false;} };
  for(let i=0;i<lines.length;i++){
    const ln = lines[i], tr = ln.trim();
    // 公式块 $$ ... $$ (可跨行)
    if(tr.startsWith("$$")){
      closeUl();
      let block=[ln];
      if(!(tr.length>2 && tr.endsWith("$$"))){
        while(i+1<lines.length && !lines[i+1].trim().endsWith("$$")){ i++; block.push(lines[i]); }
        if(i+1<lines.length){ i++; block.push(lines[i]); }
      }
      out.push(`<div class="math-block">${block.join("\n")}</div>`);
      continue;
    }
    // LaTeX 环境 \begin{itemize|enumerate} -> 列表
    const env = tr.match(/^\\begin\{(itemize|enumerate)\}/);
    if(env){
      closeUl();
      const tag = env[1]==="itemize" ? "ul" : "ol";
      const items=[];
      while(i+1<lines.length && !/^\\end\{/.test(lines[i+1].trim())){
        i++;
        const m = lines[i].trim().match(/^\\item\s*(.*)$/);
        if(m) items.push(`<li>${fmtInline(m[1])}</li>`);
      }
      if(i+1<lines.length) i++;
      out.push(`<${tag}>${items.join("")}</${tag}>`);
      continue;
    }
    const img = tr.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ closeUl(); out.push(`<img class="nimg" src="${img[2]}" alt="${img[1]}" loading="lazy">`); continue; }
    const ind = ln.match(/^(\s*)-( .*)?$/);
    if(ind){ if(!inUl){out.push("<ul>");inUl=true;} out.push(`<li>${fmtInline((ind[2]||"").slice(1))}</li>`); continue; }
    if(inUl){out.push("</ul>");inUl=false;}
    const h = ln.match(/^(#{1,4}) (.*)/);
    if(h) out.push(`<h${h[1].length}>${fmtInline(h[2])}</h${h[1].length}>`);
    else if(ln.trim()) out.push(`<p>${fmtInline(ln)}</p>`);
  }
  if(inUl) out.push("</ul>");
  return out.join("");
}
const fmtInline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");

function renderMath(el){
  if(!el || !window.renderMathInElement) return;
  try{
    renderMathInElement(el, {
      delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},
                  {left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      ignoreTags:["script","noscript","style","textarea","pre","code"],
      throwOnError:false
    });
  }catch(e){}
}

function mindmap(t){
  if(!t) return "";
  const lines = esc(t).split("\n"); let html="", stack=[];
  for(const ln of lines){
    const m = ln.match(/^(\s*)-( .*)$/); if(!m) continue;
    const lvl = Math.floor(m[1].length/2), txt = fmtInline(m[2]);
    while(stack.length>lvl){ html+="</ul>"; stack.pop(); if(stack.length) html+="</li>"; }
    const cls = (lvl===0 && stack.length===0) ? ' class="root"' : "";
    html+=`<ul><li${cls}><span>${txt}</span>`; stack.push(1);
  }
  while(stack.length){ html+="</ul>"; stack.pop(); if(stack.length) html+="</li>"; }
  return `<div class="tree">${html}</div>`;
}

function parseLecture(notes){
  if(!notes) return {pre:"", pages:[], post:""};
  const lines = notes.split("\n");
  const pages=[]; let pre=[], post=[], mode="pre";
  let cur=null, buf=[];
  const flush=()=>{ if(cur){cur.body=buf.join("\n"); pages.push(cur); cur=null;} buf=[]; };
  for(const ln of lines){
    const m = ln.match(/^#{2,3}\s*第(\d+)\s*页[:：]?\s*(.*)/);
    if(m){ flush(); mode="page"; cur={n:+m[1], title:m[2]||""}; continue; }
    if(/^##\s/.test(ln) && /疑问|待复习/.test(ln)){ flush(); mode="post"; post.push(ln); continue; }
    if(/^#\s/.test(ln) && mode==="pre"){ pre.push(ln); continue; }
    if(mode==="pre") pre.push(ln);
    else if(mode==="post") post.push(ln);
    else buf.push(ln);
  }
  flush();
  return {pre:pre.join("\n").trim(), pages, post:post.join("\n").trim()};
}

// ---------- 热词自动提取: 后台跑, 切页面/中途离开都不打断 ----------
const TERMS_REDRAW = {};                 // cid -> 局部刷新函数(各页面自己注册)
const TermsAuto = {
  key: cid => "cc_terms_job_" + cid,
  state(cid){
    try{ return JSON.parse(localStorage.getItem(this.key(cid)) || "null"); }catch(e){ return null; }
  },
  set(cid, st, extra){
    const s = Object.assign({state:st, at:Date.now()}, extra||{});
    try{ localStorage.setItem(this.key(cid), JSON.stringify(s)); }catch(e){}
  },
  running(cid){ const s = this.state(cid); return !!(s && s.state === "running"); },
  // 触发一次后台提取; 已经在跑就跳过(不会重复烧 token)
  start(cid, why){
    if(this.running(cid)) return;
    this.set(cid, "running", {why: why || ""});
    this.run(cid);
  },
  async run(cid){
    try{
      const r = await api.extractTerms(cid);
      this.set(cid, "done", {terms:(r.terms||[]).length, err:r.terms_error||""});
      try{ if(TERMS_REDRAW[cid]) TERMS_REDRAW[cid](r.terms||[]); }catch(e){}
    }catch(e){
      this.set(cid, "error", {err:String((e&&e.message)||e).slice(0,200)});
    }
  },
  // 页面渲染时调用: 若有在跑的任务, 显示提示并等它跑完(切页面回来还能接上)
  watch(cid, onState){
    const s = this.state(cid);
    if(!s) return false;
    if(s.state === "running"){
      if(onState) onState("正在自动提取热词…");
      const tick = async ()=>{
        if(!this.running(cid)) return;
        await new Promise(r=>setTimeout(r, 1500));
        if(this.running(cid)){ tick(); return; }
        const st = this.state(cid);
        if(!st) return;
        if(st.state === "done"){ if(onState) onState("热词已更新（"+(st.terms||0)+" 条）"); }
        else if(st.state === "error"){ if(onState) onState("自动提取热词失败："+(st.err||"未知原因")); }
      };
      tick();
      return true;
    }
    return false;
  }
};

function fmtSize(n){
  n = Number(n)||0;
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  if(n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + " MB";
  return (n/1024/1024/1024).toFixed(2) + " GB";
}
function fmtFileTime(ts){
  if(!ts) return "";
  const d = new Date(ts*1000);
  const p = x => String(x).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function pagedGridHTML(cid, entry, cutsByPage){
  const total = entry.pages || 0;
  if(!total) return `<div class="hint" style="padding:24px;text-align:center">无法生成分页预览（文件可能为空或格式暂不支持）</div>`;
  const off = splitOffSet(cid, entry.fid);
  let html = `<div class="pptgrid">`;
  for(let n=1;n<=total;n++){
    const info = (cutsByPage||{})[String(n)];
    // 兼容两种格式: 新 {rows:[], cols:[]} | 旧 {cuts:[float]}
    let rows=[], cols=[];
    if(info && typeof info === "object"){
      const maybeRows = info.rows, maybeCols = info.cols, maybeCuts = info.cuts;
      if(Array.isArray(maybeRows)) rows = maybeRows;
      if(Array.isArray(maybeCols)) cols = maybeCols;
      if(!rows.length && !cols.length && Array.isArray(maybeCuts)) cols = maybeCuts;  // 旧 cuts 视作 cols
    }
    const hasGrid = rows.length > 0 || cols.length > 0;
    if(hasGrid && !off.has(n)){
      const nrows = rows.length + 1;
      const ncols = cols.length + 1;
      // 关键: 黑框检测只返回「实际存在」的 PPT 段数。最后一页只有 2 页 PPT 时
      // 不能再按 nrows*ncols 补足 4 段, 否则多出来的两段就是整片白纸。
      const cellCount = Array.isArray(info.cells) ? info.cells.length : 0;
      const cnt = Math.max(1, parseInt(info.segs, 10) || cellCount || nrows * ncols);
      for(let seg=1; seg<=cnt; seg++){
        const isLast = seg === cnt;
        const unspanLink = isLast ? `<a class="unspan" data-page="${n}" title="恢复整页显示">显示原页</a>` : "";
        html += `<div class="pcell"><img src="${pageURL(cid,entry.fid,n,seg,entry.mtime)}" data-page="${n}" data-seg="${seg}" loading="lazy" draggable="false"><div class="pgno">${n} / ${total} · 拆分 ${seg}/${cnt}${unspanLink}</div></div>`;
      }
    } else {
      const respanLink = hasGrid ? `<a class="respan" data-page="${n}" title="重新按内容拆分">恢复拆分</a>` : "";
      html += `<div class="pcell"><img src="${pageURL(cid,entry.fid,n,0,entry.mtime)}" data-page="${n}" loading="lazy" draggable="false"><div class="pgno">${n} / ${total}${respanLink}</div></div>`;
    }
  }
  return html + `</div>`;
}

// ---------- 预览翻阅位置: 按「场景 + 课堂 + 文件」分别记忆 ----------
// 极简可靠版:
//   记录 = 滚动时立刻把 {t:scrollTop, l:scrollLeft, p:页码, s:段, o:偏移} 写下来(同步, 不等防抖)
//   恢复 = 进页面时按页码锚点恢复一次, 图片加载完再补两次; 之后绝不再动用户的位置
// 关键: 不再有"程序滚动/用户滚动"的判定, 所以用户翻到哪就一定记到哪。
const pvPosKey = (cid, fid, src, scene)=>`${scene||"detail"}|${src||"class"}|${cid}|${fid}`;

function pvFilePref(cid, scene){
  const sc = scene || "detail";
  return UI_STATE.preview_files[sc+"|"+cid]
      || localStorage.getItem("cc_file_"+sc+"_"+cid)
      || localStorage.getItem("cc_file_"+cid) || "ppt";
}

// 旧版 key(没有场景维度 / 旧字段名)兼容读取
function pvLegacyKeys(key){
  const ps = String(key||"").split("|");
  const out = [];
  if(ps.length === 4) out.push(ps[1]+"|"+ps[2]+"|"+ps[3]);
  return out;
}

function pvAnchor(col){
  const cr = col.getBoundingClientRect();
  let best = null, bd = Infinity;
  col.querySelectorAll(".pcell img[data-page]").forEach(im=>{
    const d = Math.abs(im.getBoundingClientRect().top - cr.top);
    if(d < bd){ bd = d; best = im; }
  });
  if(!best) return null;
  return {p:+best.dataset.page, s:+(best.dataset.seg||0),
          o:Math.round(best.getBoundingClientRect().top - cr.top)};
}

// 读取记忆: localStorage 优先(同源即时可用), 服务端兜底(换浏览器/换端口时用)
function pvLoad(key){
  const k = key || PREVIEW.posKey;
  if(!k) return null;
  const pick = (v)=>{
    if(!v || typeof v!=="object") return null;
    if(Number.isFinite(v.t) || Number.isFinite(v.top)) return v;
    return null;
  };
  let v = null;
  try{ v = pick(JSON.parse(localStorage.getItem("cc_pos_"+k)||"null")); }catch(e){}
  if(!v) v = pick(UI_STATE.preview_pos[k]);
  if(!v){
    for(const lk of pvLegacyKeys(k)){
      try{ v = pick(JSON.parse(localStorage.getItem("cc_pos_"+lk)||"null")); }catch(e){}
      if(v) break;
      v = pick(UI_STATE.preview_pos[lk]);
      if(v) break;
    }
  }
  if(!v) return null;
  // 旧格式 {top,left,anchor:{page,seg,off}} -> 新格式
  if(v.t == null && Number.isFinite(v.top)) v.t = v.top;
  if(v.l == null && Number.isFinite(v.left)) v.l = v.left;
  if(v.p == null && v.anchor && Number.isFinite(v.anchor.page)){
    v.p = v.anchor.page; v.s = v.anchor.seg||0; v.o = v.anchor.off||0;
  }
  return v;
}

// 写入记忆: 立刻同步写本地, 服务端节流写
let pvSaveTimer = null, pvSaveLast = 0;
function pvSave(col, force){
  if(!col || !PREVIEW.posKey) return;
  const v = {t: Math.round(col.scrollTop), l: Math.round(col.scrollLeft)};
  const a = pvAnchor(col);
  if(a){ v.p = a.p; v.s = a.s; v.o = a.o; }
  try{ localStorage.setItem("cc_pos_"+PREVIEW.posKey, JSON.stringify(v)); }catch(e){}
  const now = Date.now();
  if(force || now - pvSaveLast > 400){
    pvSaveLast = now;
    uiStateSet("preview_pos", PREVIEW.posKey, v);
  }
}

// 恢复: 按页码锚点回到同一张 PPT, 失败退回像素; 图片陆续加载后总高度会变, 补两次
function pvApply(col, v, preferAnchor){
  if(!col || !v) return;
  const set = ()=>{
    if(col.__pvUserMoved) return;          // 用户已经动过位置, 不要再抢
    // 只用像素: 图片高度确定后 scrollTop 就是精确位置。
    // (页码锚点在图片尺寸变化时算得出偏差, 反而会把位置带到别处)
    if(Number.isFinite(v.t)){
      col.scrollTop = v.t;
      col.scrollLeft = v.l||0;
    }
  };
  set();
  setTimeout(set, 350);
  setTimeout(set, 1100);
  // 图片全部加载完后再校正一次(此时总高度才最终确定, 纯像素位置才准)
  let tries = 0;
  const iv = setInterval(()=>{
    const imgs = Array.from(col.querySelectorAll("img"));
    const done = imgs.length === 0 || imgs.every(im => im.complete);
    if(done || ++tries > 60){
      clearInterval(iv);
      if(done) set();
    }
  }, 250);
}

function pvFlushAll(){
  const c = document.querySelector(".pptcol");
  if(c) pvSave(c, true);
}

function pvBind(col){
  if(!col || col.__pvBound) return;
  col.__pvBound = true;
  col.__pvUserMoved = false;
  // 用户一动(滚轮/拖条/键盘/点页码)就算"用户接管", 后续的程序补偿不再抢位置
  const mark = ()=>{ col.__pvUserMoved = true; };
  col.addEventListener("wheel", mark, {passive:true});
  col.addEventListener("pointerdown", mark, {passive:true});
  col.addEventListener("keydown", mark);
  // 滚动即记录(节流 250ms), 程序恢复引起的滚动也会记 —— 记下来的正是恢复后的正确位置, 无害
  let last = 0;
  col.addEventListener("scroll", ()=>{
    const now = Date.now();
    if(now - last < 250) return;
    last = now;
    pvSave(col, false);
  }, {passive:true});
}

window.addEventListener("pagehide", ()=>{ const c=document.querySelector(".pptcol"); if(c) pvSave(c, true); });
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden"){ const c=document.querySelector(".pptcol"); if(c) pvSave(c, true); }
});

async function renderPreview(col, cid, fid, src, scene){
  if(!col) return;
  // 只能用「上一次的容器」存走旧位置：新容器此时还没内容(scrollTop=0),
  // 直接用它会把刚翻到的位置覆盖成 0。页面已重建时内存里 UI_STATE 已是最新值。
  if(PREVIEW.col && PREVIEW.posKey && PREVIEW.col.isConnected) pvSave(PREVIEW.col, true);
  pvBind(col);
  resetOcr();
  PREVIEW.cid = cid; PREVIEW.col = col; PREVIEW.src = src === "group" ? "group" : "class";
  PREVIEW.scene = scene === "live" ? "live" : (scene === "group" ? "group" : "detail");
  col.classList.remove("textmode");
  col.innerHTML = `<div class="hint" style="padding:24px;text-align:center">加载预览…</div>`;
  let files = [];
  try{ files = (await api.files(cid, PREVIEW.src)).files || []; }
  catch(e){ col.innerHTML = `<div class="err" style="padding:12px">文件列表加载失败：${esc(e.message||e)}</div>`; return; }
  PREVIEW.files = files;
  let entry = files.find(f=>f.fid===fid);
  if(!entry && files.length) entry = files.find(f=>f.fid==="ppt") || files[0];
  if(!entry){
    PREVIEW.fid = null; PREVIEW.entry = null; PREVIEW.cuts = {}; PREVIEW.posKey = null;
    updatePreviewTools(null);
    col.innerHTML = previewEmptyHTML();
    return;
  }
  PREVIEW.fid = entry.fid; PREVIEW.entry = entry; PREVIEW.cuts = {};
  PREVIEW.posKey = pvPosKey(cid, entry.fid, PREVIEW.src, PREVIEW.scene);
  try{ localStorage.setItem("cc_file_"+PREVIEW.scene+"_"+cid, entry.fid); }catch(e){}
  uiStateSet("preview_files", PREVIEW.scene+"|"+cid, entry.fid);
  updatePreviewTools(entry);

  if(isPagedKind(entry.kind)){
    if(!entry.pages){
      try{
        const info = await api.fileInfo(cid, entry.fid, PREVIEW.src);
        entry.pages = info.pages || 0;
        entry.kind = info.kind || entry.kind;
        entry.error = info.error || null;
      }catch(e){ entry.pages = 0; entry.error = e.message || String(e); }
    }
    if(!entry.pages){
      // 空白不能当成功: 明确展示失败原因, 并给重试入口
      col.innerHTML = pagedErrorHTML(cid, entry);
      const rb = col.querySelector("#pvretry");
      if(rb) rb.onclick = ()=>renderPreview(col, cid, entry.fid, PREVIEW.src, PREVIEW.scene);
      return;
    }
    col.innerHTML = pagedGridHTML(cid, entry, {});
    applyZoom();
    if(entry.pages) applyAutoSplit(col, cid, entry);
  } else if(entry.kind === "image"){
    const base = fileBase(cid, PREVIEW.src);
    col.innerHTML = `<div class="pptgrid"><div class="pcell"><img src="${base}/files/${entry.fid}/raw?v=${entry.mtime}" data-page="1" loading="lazy" draggable="false"><div class="pgno">${esc(entry.name)}</div></div></div>`;
    applyZoom();
  } else if(entry.kind === "md" || entry.kind === "txt"){
    col.classList.add("textmode");
    try{
      const j = await api.fileContent(cid, entry.fid, PREVIEW.src);
      col.innerHTML = `<div class="filetext">${entry.kind==="md"
        ? md(j.content||"")
        : `<pre>${esc(j.content||"")}</pre>`}</div>`;
      renderMath(col);
    }catch(e){ col.innerHTML = `<div class="err" style="padding:12px">读取失败：${esc(e.message||e)}</div>`; }
  } else if(entry.kind === "audio" || entry.kind === "video"){
    col.classList.add("textmode");
    const src = `${fileBase(cid, PREVIEW.src)}/files/${entry.fid}/raw?v=${entry.mtime}`;
    col.innerHTML = entry.kind==="audio"
      ? `<div class="filemedia"><audio controls src="${src}"></audio><div class="hint" style="margin-top:10px">${esc(entry.name)}</div></div>`
      : `<div class="filemedia"><video controls src="${src}"></video><div class="hint" style="margin-top:10px">${esc(entry.name)}</div></div>`;
  } else {
    col.classList.add("textmode");
    col.innerHTML = `<div class="fileunsupported"><div style="font-size:28px">📦</div><b>${esc(entry.name)}</b>
      <div class="hint" style="margin-top:6px">该格式暂不支持内嵌预览</div>
      <a class="btn ghost" href="${fileBase(cid, PREVIEW.src)}/files/${entry.fid}/raw" target="_blank" download>下载原文件</a></div>`;
  }
  // 渲染完(含异步图片/切分)恢复到本文件上次翻到的位置
  const _pv = pvLoad(PREVIEW.posKey);
  if(_pv) pvApply(col, _pv);
}

async function applyAutoSplit(col, cid, entry){
  try{
    col.__pvKeepTop = col.scrollTop;      // 切分前的位置, 切分后接着用
    let j = await api.fileLayout(cid, entry.fid, false, PREVIEW.src);
    if(!j.detected) j = await api.fileLayout(cid, entry.fid, true, PREVIEW.src);
    const cuts = j.pages || {};
    if(PREVIEW.fid !== entry.fid) return;
    const keys = Object.keys(cuts);
    if(!keys.length) return;
    PREVIEW.cuts = cuts;
    col.innerHTML = pagedGridHTML(cid, entry, cuts);
    applyZoom();
    // 切分只是把一页拆成几段, 整体顺序不变: 保持切分前的滚动位置即可。
    // (以前这里按页码锚点恢复, 图片尺寸一变锚点就算偏, 会把位置恢复到别的地方)
    if(Number.isFinite(col.__pvKeepTop)) col.scrollTop = col.__pvKeepTop;
    // 进课堂时不再弹「已自动拆分」提示: 切分是默认行为, 页脚已有「显示原页」入口
  }catch(e){}
}

async function switchPreview(cid, fid){
  const col = document.getElementById("pptpages");
  if(!col) return;
  if(fid){
    try{ localStorage.setItem("cc_file_"+cid, fid); }catch(e){}
    uiStateSet("preview_files", cid, fid);
  }
  await renderPreview(col, cid, fid);
}

document.addEventListener("click", e=>{
  const a = e.target.closest ? e.target.closest("a.unspan,a.respan") : null;
  if(!a) return;
  e.preventDefault(); e.stopPropagation();
  const {cid,fid,entry,cuts,col} = PREVIEW;
  if(!entry || !col) return;
  const n = parseInt(a.dataset.page,10);
  const off = splitOffSet(cid,fid);
  if(a.classList.contains("unspan")) off.add(n); else off.delete(n);
  saveSplitOff(cid,fid,off);
  const st = col.scrollTop;
  col.innerHTML = pagedGridHTML(cid, entry, cuts);
  applyZoom();
  col.scrollTop = st;
});

// 两种模式: 管理层(上传/改名/删除) 与 选择层(纯列表, 点击即切换预览)
function openFilesModal(cid, opts={}){
  const pickOnly = !!opts.pickOnly;
  const old = document.getElementById("filesModal"); if(old) old.remove();
  const wrap = document.createElement("div");
  wrap.className = "modalwrap"; wrap.id = "filesModal";
  wrap.innerHTML = `<div class="modalbox filebox">
    <h3>${pickOnly ? "📄 选择预览文件" : "📁 文件列表"}</h3>
    <div class="hint" style="margin-bottom:8px">${pickOnly
      ? "点击文件即可切换预览（管理文件请用课堂页「文件列表」）。标签区分「课堂文件」与「课程文件」。"
      : "「课程文件」属于本课程、所有课堂共享，在这里只读；「课堂文件」只属于本课堂。"}</div>
    <div id="fileListBody"><div class="hint" style="padding:16px">加载中…</div></div>
    ${pickOnly ? "" : `<div class="minirow" style="margin-top:10px">
      <button class="btn primary" id="fileUpBtn">＋ 上传文件</button>
      <input type="file" id="fileUpInput" style="display:none" multiple>
      <button class="btn ghost" id="fileCourseBtn" style="display:none">📁 管理课程文件</button>
      <span class="hint">docx / xlsx 需本机 LibreOffice 转换，首次预览稍慢</span></div>`}
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="fileClose">关闭</button></div>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.querySelector("#fileClose").onclick = close;
  wrap.addEventListener("click", ev=>{ if(ev.target === wrap) close(); });
  const body = wrap.querySelector("#fileListBody");

  const bindToggle = ()=>{
    const ck = wrap.querySelector("#cfUseCk");
    if(!ck) return;
    ck.onchange = async ()=>{
      ck.disabled = true;
      try{
        await api.useCourseFiles(cid, ck.checked);
        ccToast(ck.checked ? "已开启：课程文件参与热词抽取与讲稿/思维导图参考"
                           : "已关闭：课程文件不再参与热词抽取与讲稿参考");
      }catch(e){ ck.checked = !ck.checked; alert("设置失败：" + (e.message||e)); }
      finally{ ck.disabled = false; }
    };
  };

  const refresh = async ()=>{
    try{
      const j = await api.files(cid);
      const files = j.files || [];
      const gid = j.group_id || null;
      const courseBtn = wrap.querySelector("#fileCourseBtn");
      if(courseBtn){
        courseBtn.style.display = gid ? "" : "none";
        if(gid) courseBtn.onclick = ()=>{ close(); openCourseFilesModal(gid, "", ()=>{ openFilesModal(cid, opts); }); };
      }
      const toggle = (!pickOnly && gid) ? `<label class="cfuse">
        <input type="checkbox" id="cfUseCk" ${j.use_course_files?"checked":""}>
        把本课程的「课程文件」纳入热词抽取与讲稿 / 思维导图参考</label>` : "";
      if(!files.length){
        body.innerHTML = toggle + `<div class="hint" style="padding:18px;text-align:center">还没有文件</div>`;
        bindToggle();
        return;
      }
      body.innerHTML = toggle + `<div class="ftable">` + files.map(f=>{
        const cur = PREVIEW.cid===cid && PREVIEW.fid===f.fid;
        const isCourse = f.source === "course";
        const tag = isCourse ? `<i class="ftag cf">课程文件</i>`
                             : `<i class="ftag">课堂文件</i>${f.fid==="ppt"?'<i class="ftag">PPT</i>':""}`;
        return `<div class="frow ${cur?"cur":""}${pickOnly||isCourse?" pick":""}" data-fid="${f.fid}" data-src="${isCourse?"course":"class"}">
          <span class="fic">${KIND_ICON[f.kind]||"📄"}</span>
          <span class="fname" title="${esc(f.name)}">${esc(f.name)}${tag}</span>
          <span class="fmeta">${KIND_LABEL[f.kind]||"其他"} · ${fmtSize(f.size)} · ${fmtFileTime(f.mtime)}${isCourse?" · 只读":""}</span>
          ${pickOnly ? "" : (isCourse ? `<span class="facts"><button class="btn ghost fview" data-fid="${f.fid}">预览</button></span>`
            : `<span class="facts">
            <button class="btn ghost fren" data-fid="${f.fid}">改名</button>
            <button class="btn danger fdel" data-fid="${f.fid}">删除</button>
          </span>`)}
        </div>`;
      }).join("") + `</div>`;
      bindToggle();

      if(pickOnly){
        body.querySelectorAll(".frow").forEach(r=>r.onclick=()=>{ switchPreview(cid, r.dataset.fid); close(); });
        return;
      }
      body.querySelectorAll(".frow.pick").forEach(r=>r.onclick=()=>{ switchPreview(cid, r.dataset.fid); close(); });
      body.querySelectorAll(".fren").forEach(b=>b.onclick=async()=>{
        const f = files.find(x=>x.fid===b.dataset.fid); if(!f) return;
        const nm = prompt("新的文件名", f.name); if(!nm || nm===f.name) return;
        try{
          await api.fileRename(cid, f.fid, nm);
          await refresh();

// 缩放: 1=一页一行铺满; >1 放大看单页细节; <1 逐级缩小, 空隙够大时自动 2/3 页一行
let zoomv = parseFloat(localStorage.getItem("cc_zoom3")||"1");
const ZMIN = 0.22, ZMAX = 4;
function zoom(){ return Math.max(ZMIN, Math.min(ZMAX, zoomv)); }
function applyZoom(){
  const z = zoom();
  document.querySelectorAll(".pptgrid").forEach(g=>g.style.setProperty("--pw", (z*100).toFixed(2)+"%"));
  document.querySelectorAll(".zlab").forEach(e=>e.textContent = Math.round(z*100)+"%");
  localStorage.setItem("cc_zoom3", String(z));
}
function zoomAround(col, nz, cx, cy){
  if(!col) return;
  nz = Math.max(ZMIN, Math.min(ZMAX, nz));
  const z = zoom();
  if(Math.abs(nz-z) < 1e-4) return;
  const r = col.getBoundingClientRect();
  const ox = Math.max(0, Math.min(r.width, cx - r.left)), oy = Math.max(0, Math.min(r.height, cy - r.top));
  const px = col.scrollLeft + ox, py = col.scrollTop + oy;
  zoomv = nz; applyZoom();
  const k = nz / z;          // 保持鼠标下的内容不跑
  col.scrollLeft = px*k - ox;
  col.scrollTop = py*k - oy;
}
function zoomStep(dir, col){
  col = col || document.querySelector(".pptcol"); if(!col) return;
  const r = col.getBoundingClientRect();
  zoomAround(col, zoom()*Math.pow(1.16, dir), r.left + r.width/2, r.top + r.height/2);
}
function zoomFit(col){
  col = col || document.querySelector(".pptcol"); if(!col) return;
  const r = col.getBoundingClientRect();
  zoomAround(col, 1, r.left + 10, r.top + 10);
}
// Ctrl+滚轮 = 连续缩放(只对鼠标所在的PPT区域), 普通滚轮保持原生上下滚动
document.addEventListener("wheel", e=>{
  if(!e.ctrlKey) return;
  const col = e.target.closest ? e.target.closest(".pptcol") : null;
  if(!col) return;
  e.preventDefault();
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : 1);
  zoomAround(col, zoom()*Math.exp(-dy*0.0015), e.clientX, e.clientY);
}, {passive:false});

function enablePan(el){
  let down=false, sx=0, sy=0, sl=0, st=0;
  el.addEventListener("mousedown", e=>{
    if(ocrOn || e.button!==0 || e.target.tagName==="A") return;
    if(el.classList.contains("textmode")) return;   // md/txt/音视频预览允许选中文字与操作控件
    e.preventDefault(); down=true; sx=e.clientX; sy=e.clientY; sl=el.scrollLeft; st=el.scrollTop;
    el.__panned=false; el.classList.add("panning");
  });
  el.addEventListener("mousemove", e=>{
    if(!down) return;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy) > 4) el.__panned = true;
    el.scrollLeft = sl - (e.clientX-sx);
    el.scrollTop = st - (e.clientY-sy);
  });
  ["mouseup","mouseleave"].forEach(ev=>el.addEventListener(ev, ()=>{ down=false; el.classList.remove("panning"); }));
}

// ---------- PPT 区域截图识别 (OCR) ----------
let ocrOn=false, ocrCol=null, ocrBtn=null, ocrImg=null, ocrRect=null, ocrStart=null, ocrSel=null;
const clamp = (v,a,b)=>Math.max(a, Math.min(b,v));

function toggleOcr(col, btn){
  const on = !ocrOn;
  if(ocrSel){ ocrSel.remove(); ocrSel=null; }
  ocrOn = on; ocrCol = on ? col : null; ocrBtn = on ? btn : null;
  if(col) col.classList.toggle("ocr-mode", on);
  if(btn){ btn.classList.toggle("on", on); btn.textContent = on ? "✂ 拖选区域中…" : "✂ 取字"; }
}
function resetOcr(){
  if(ocrSel){ ocrSel.remove(); ocrSel=null; }
  if(ocrCol) ocrCol.classList.remove("ocr-mode");
  if(ocrBtn){ ocrBtn.classList.remove("on"); ocrBtn.textContent = "✂ 取字"; }
  ocrOn=false; ocrCol=null; ocrBtn=null; ocrImg=null; ocrStart=null;
}
function paintSel(x,y){
  if(!ocrSel) return;
  ocrSel.style.left = Math.min(ocrStart.x,x)+"px";
  ocrSel.style.top = Math.min(ocrStart.y,y)+"px";
  ocrSel.style.width = Math.abs(x-ocrStart.x)+"px";
  ocrSel.style.height = Math.abs(y-ocrStart.y)+"px";
}
document.addEventListener("mousemove", e=>{
  if(!ocrSel) return;
  e.preventDefault();
  paintSel(clamp(e.clientX, ocrRect.left, ocrRect.right), clamp(e.clientY, ocrRect.top, ocrRect.bottom));
});
document.addEventListener("mouseup", e=>{
  if(!ocrSel) return;
  const x = clamp(e.clientX, ocrRect.left, ocrRect.right);
  const y = clamp(e.clientY, ocrRect.top, ocrRect.bottom);
  const rect = {left:Math.min(ocrStart.x,x), top:Math.min(ocrStart.y,y),
                width:Math.abs(x-ocrStart.x), height:Math.abs(y-ocrStart.y)};
  ocrSel.remove(); ocrSel=null; ocrStart=null;
  if(rect.width < 8 || rect.height < 8){ ocrImg=null; return; }
  cropAndOcr(ocrImg, rect); ocrImg=null;
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && ocrOn) resetOcr(); });

function cropAndOcr(img, rect){
  if(!img || !img.naturalWidth) return;
  const r = img.getBoundingClientRect();
  if(!r.width) return;
  const sx = (rect.left - r.left) / r.width * img.naturalWidth;
  const sy = (rect.top - r.top) / r.height * img.naturalHeight;
  const sw = rect.width / r.width * img.naturalWidth;
  const sh = rect.height / r.height * img.naturalHeight;
  const scale = Math.min(2.5, Math.max(1, 1200 / Math.max(sw, sh)));
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(sw*scale));
  cv.height = Math.max(1, Math.round(sh*scale));
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  cv.toBlob(blob=>{ if(blob) uploadOcr(blob); }, "image/png");
}
function ocrPanel(){
  let p = document.getElementById("ocrpanel");
  if(p) return p;
  p = document.createElement("div"); p.id = "ocrpanel";
  p.innerHTML = `<div class="minirow" style="margin-bottom:8px"><b style="font-size:13px">✂ 识别结果</b>
      <button class="btn ghost" id="ocrclose" style="padding:3px 10px;font-size:12px">关闭</button></div>
    <textarea id="ocrtext" placeholder="识别结果（可修改后复制）"></textarea>
    <div class="minirow" style="margin:8px 0 0"><button class="btn primary" id="ocrcopy" style="padding:6px 14px">复制</button>
      <span class="hint" id="ocrstat"></span></div>`;
  document.body.appendChild(p);
  p.querySelector("#ocrclose").onclick = ()=>p.remove();
  p.querySelector("#ocrcopy").onclick = ()=>copyOcr();
  return p;
}
async function copyOcr(){
  const p = document.getElementById("ocrpanel"); if(!p) return;
  const txt = p.querySelector("#ocrtext").value;
  try{
    await navigator.clipboard.writeText(txt);
    p.querySelector("#ocrstat").textContent = "已复制到剪贴板，去笔记里 Ctrl+V 粘贴";
  }catch(e){
    const ta = p.querySelector("#ocrtext"); ta.focus(); ta.select();
    p.querySelector("#ocrstat").textContent = "自动复制受限，已全选，按 Ctrl+C";
    try{ document.execCommand("copy"); }catch(_){}
  }
}
async function uploadOcr(blob){
  const p = ocrPanel();
  const ta = p.querySelector("#ocrtext"), st = p.querySelector("#ocrstat");
  ta.value = ""; st.textContent = "识别中…";
  try{
    const f = new FormData(); f.append("file", blob, "crop.png");
    const r = await fetch("/api/ocr", {method:"POST", body:f});
    if(r.status === 404){
      st.textContent = "识别接口未加载：需要重启一次 app.py（旧进程仍在运行）";
      return;
    }
    if(!(r.headers.get("content-type")||"").includes("application/json")){
      st.textContent = "识别失败：服务未就绪，请重启 app.py";
      return;
    }
    const j = await r.json();
    if(j.error || !j.text){ st.textContent = "识别失败：" + (j.error || "空结果"); return; }
    ta.value = j.text;
    await copyOcr();
  }catch(e){ st.textContent = "识别失败：网络错误"; }
}

// 给PPT区域挂上交互: 拖拽平移 + 区域识别入口
function initPptCol(col, ocrButton){
  if(!col) return;
  enablePan(col);
  applyZoom();
  col.addEventListener("mousedown", e=>{
    if(!ocrOn || ocrCol !== col) return;
    const im = e.target.closest ? e.target.closest(".pcell img") : null;
    if(!im) return;
    e.preventDefault(); e.stopPropagation();
    ocrImg = im; ocrRect = im.getBoundingClientRect();
    const x = clamp(e.clientX, ocrRect.left, ocrRect.right);
    const y = clamp(e.clientY, ocrRect.top, ocrRect.bottom);
    ocrStart = {x, y};
    ocrSel = document.createElement("div"); ocrSel.id = "ocrsel";
    document.body.appendChild(ocrSel); paintSel(x, y);
  }, true);
  if(ocrButton) ocrButton.onclick = ()=>toggleOcr(col, ocrButton);
}

let viewerEl = null;
function openViewer(src){
  if(viewerEl) viewerEl.remove();
  let z = 1, tx = 0, ty = 0;
  const v = document.createElement("div"); v.id = "pgviewer";
  v.innerHTML = `<img draggable="false" src="${src}"><div class="vbar"><span class="vz">100%</span><button id="vreset">重置</button><button id="vclose">✕ 关闭</button></div>`;
  document.body.appendChild(v); viewerEl = v;
  const img = v.querySelector("img"), vz = v.querySelector(".vz");
  const apply = ()=>{ img.style.transform = `translate(${tx}px,${ty}px) scale(${z})`; vz.textContent = Math.round(z*100)+"%"; };
  img.addEventListener("load", ()=>{ const k = Math.min((innerWidth-120)/img.naturalWidth, (innerHeight-140)/img.naturalHeight);
    z = Math.min(k, 1.5); tx = (innerWidth - img.naturalWidth*z)/2; ty = (innerHeight - img.naturalHeight*z)/2 + 20; apply(); });
  if(img.complete) img.dispatchEvent(new Event("load"));
  v.addEventListener("wheel", e=>{ e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 1/1.12;
    const nz = Math.min(5, Math.max(0.2, z*f));
    const r = v.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    tx = mx - f*(mx - tx); ty = my - f*(my - ty); z = nz; apply();
  }, {passive:false});
  let down=false, sx=0, sy=0;
  v.addEventListener("mousedown", e=>{ if(e.target.tagName==="BUTTON") return; e.preventDefault(); down=true; sx=e.clientX; sy=e.clientY; v.style.cursor="grabbing"; });
  v.addEventListener("mousemove", e=>{ if(!down) return; tx += e.clientX - sx; ty += e.clientY - sy; sx=e.clientX; sy=e.clientY; apply(); });
  ["mouseup","mouseleave"].forEach(ev=>v.addEventListener(ev, ()=>{ down=false; v.style.cursor="grab"; }));
  const close = ()=>{ v.remove(); viewerEl = null; document.removeEventListener("keydown", esc); };
  const esc = e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", esc);
  v.querySelector("#vclose").onclick = close;
  v.querySelector("#vreset").onclick = ()=>{ img.dispatchEvent(new Event("load")); };
  v.style.cursor = "grab";
}
document.addEventListener("click", e=>{
  if(ocrOn) return;
  const im = e.target.closest ? e.target.closest(".pcell img") : null;
  if(!im) return;
  const col = im.closest(".pptcol");
  if(col && col.__panned) return;
  openViewer(im.src.split("?")[0]);
});

function scrollPage(container, n){
  if(!container) return;
  // 点页码是用户主动翻页: 标记为用户接管, 别让程序补偿再抢位置
  if(container) container.__pvUserMoved = true;
  const img = container.querySelector(`.pcell img[data-page="${n}"]`);
  if(!img) return;
  const top = container.scrollTop + (img.getBoundingClientRect().top - container.getBoundingClientRect().top) - 4;
  container.scrollTo({top: Math.max(0, top), behavior:"smooth"});
}

function openMathDialog(vw, from, to, latex, display){
  const mask = document.createElement("div");
  mask.className = "mathdlg-mask";
  mask.innerHTML = `<div class="mathdlg">
    <div class="mathdlg-t">编辑公式代码（${display ? "块级" : "行内"}）</div>
    <textarea spellcheck="false"></textarea>
    <div class="mathdlg-pv"></div>
    <div class="minirow" style="justify-content:flex-end;margin:8px 0 0">
      <button class="btn ghost" data-x>取消</button>
      <button class="btn primary" data-ok>确定</button>
    </div></div>`;
  const ta = mask.querySelector("textarea"), pv = mask.querySelector(".mathdlg-pv");
  ta.value = latex;
  const draw = ()=>{ try{ pv.innerHTML = katex.renderToString(ta.value || "\\text{空}", {displayMode:display, throwOnError:false}); }
    catch(e){ pv.textContent = ta.value; } };
  draw(); ta.oninput = draw;
  mask.querySelector("[data-x]").onclick = ()=>mask.remove();
  mask.querySelector("[data-ok]").onclick = ()=>{
    const ins = display ? `$$${ta.value}$$` : `$${ta.value}$`;
    vw.dispatch({changes:{from, to, insert:ins}, selection:{anchor:Math.min(from + ins.length, vw.state.doc.length)}});
    mask.remove(); vw.focus();
  };
  ta.onkeydown = e=>{
    if(e.key === "Escape"){ e.preventDefault(); mask.remove(); vw.focus(); }
    if((e.ctrlKey||e.metaKey) && e.key === "Enter"){ e.preventDefault(); mask.querySelector("[data-ok]").click(); }
  };
  document.body.appendChild(mask);
  setTimeout(()=>ta.focus(), 30);
}

let CM_LOAD = null;
// 同一文件的写入串行执行, 避免自动保存并发覆盖
const NOTE_SAVE_CHAIN = new Map();
function chainNoteSave(key, fn){
  const prev = NOTE_SAVE_CHAIN.get(key) || Promise.resolve();
  const p = prev.catch(()=>{}).then(fn);
  NOTE_SAVE_CHAIN.set(key, p);
  p.finally(()=>{ if(NOTE_SAVE_CHAIN.get(key) === p) NOTE_SAVE_CHAIN.delete(key); });
  return p;
}
function loadCM(){
  if(!CM_LOAD){
    if(window.CCCM && window.CCCM.V && window.CCCM.S && window.CCCM.C){
      CM_LOAD = Promise.resolve(window.CCCM);
    } else {
      // 兜底: 本地 vendor 缺失时才回退 CDN(离线不可用)
      CM_LOAD = Promise.all([
        import("https://esm.sh/@codemirror/view@6"),
        import("https://esm.sh/@codemirror/state@6"),
        import("https://esm.sh/@codemirror/commands@6")
      ]).then(([V,S,C])=>({V,S,C})).catch(e=>{ CM_LOAD=null; throw e; });
    }
  }
  return CM_LOAD;
}

          // 否则在底部时浏览器会把视口“贴住底部”, 看起来像子项向上撑开。
          const keep = ()=>{ if(Math.abs(sc.scrollTop - y0) > 0) sc.scrollTop = y0; };

            ? sel.head >= this.hideFrom && sel.head <= this.hideTo

          if(!wasCollapsed && inside) spec.selection = {anchor: this.anchor};
          vw.dispatch(spec);
          keep(); vw.requestMeasure({read(){}, write:keep}); vw.focus();
          requestAnimationFrame(()=>{ keep(); requestAnimationFrame(keep); });
        });
