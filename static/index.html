  function openLink(url){
    const u = String(url || "").trim();
    if(!/^(https?:\/\/|mailto:)/i.test(u)) return;   // 只放行 http(s)/mailto，避免 javascript: 之类
    const w = window.open(u, "_blank", "noopener,noreferrer");
    try{ if(w) w.opener = null; }catch(e){}
  }

  // 缩进按“视觉列”比较: Tab 记 4 列, 全角空格记 2 列, 兼容混合缩进
  function indentCol(t){
    let w = 0;
    for(const ch of (t.match(/^\s*/) || [""])[0]){
      if(ch === "\t") w += 4 - (w % 4);
      else if(ch === "\u3000") w += 2;
      else w += 1;
    }
    return w;
  }

  // 块级结构扫描: ``` 代码块 / |管道表| / --- 分割线。
  // 这些行整体走块级 widget，内部不再应用行内、列表或折叠装饰。
  function blockScan(st){
    const n = st.doc.lines, skip = new Set(), starts = new Map();
    const cells = t=>{
      let s = t.trim();
      if(s.startsWith("|")) s = s.slice(1);
      if(s.endsWith("|")) s = s.slice(0, -1);
      return s.split("|").map(x=>x.trim());
    };
    const isSep = t=>{
      const s = t.trim();
      if(!s.startsWith("|")) return false;
      const cs = cells(s);
      return cs.length >= 1 && cs.every(c=> /^:?-{2,}:?$/.test(c));
    };
    let i = 1;
    while(i <= n){
      const line = st.doc.line(i), txt = line.text, tr = txt.trim();
      if(/^```+/.test(tr)){
        let close = 0;
        for(let j = i + 1; j <= n; j++){
          if(/^```+\s*$/.test(st.doc.line(j).text.trim())){ close = j; break; }
        }
        const end = close || n;
        const code = [];
        for(let j = i + 1; j <= end; j++) code.push(st.doc.line(j).text);
        if(close) code.pop();                       // 去掉闭合围栏那一行
        starts.set(i, {kind:"code", from: line.from, to: st.doc.line(end).to,
                       code: code.join("\n"), lang: tr.replace(/^```+/, "").trim()});
        for(let j = i; j <= end; j++) skip.add(j);
        i = end + 1; continue;
      }
      if(tr.startsWith("|") && i + 1 <= n && isSep(st.doc.line(i+1).text)){
        const header = cells(txt);
        const align = cells(st.doc.line(i+1).text).map(c=>
          c.startsWith(":") && c.endsWith(":") ? "center" :
          c.endsWith(":") ? "right" : c.startsWith(":") ? "left" : "");
        const rows = [];
        let j = i + 2;
        while(j <= n && st.doc.line(j).text.trim().startsWith("|")){
          rows.push(cells(st.doc.line(j).text)); j++;
        }
        starts.set(i, {kind:"table", from: line.from, to: st.doc.line(j-1).to, header, align, rows});
        for(let k = i; k < j; k++) skip.add(k);
        i = j; continue;
      }
      if(/^(?:---+|___+|\*\*\*+)$/.test(tr)){
        starts.set(i, {kind:"hr", from: line.from, to: line.to});
        skip.add(i); i++; continue;
      }
      i++;
    }
    return {skip, starts};
  }

  // 折叠关系扫描: 与 buildDeco 共用同一套 key / 子项范围算法, 供回车行为判断折叠状态
  function foldScan(st, bskip){
    const dlines = [];
    for(let i = 1; i <= st.doc.lines; i++) dlines.push(st.doc.line(i));
    const indentOf = t => (t.match(/^\s*/) || [""])[0].length;
    const lmeta = dlines.map(ln=>{
      const m = ln.text.match(/^(\s*)- (.*)$/);
      return {blank: !ln.text.trim(), indent: indentOf(ln.text), col: indentCol(ln.text),
              item: !!m, marker: m ? m[1].length + 2 : 0, body: m ? m[2] : ln.text};
    });
    const childEnd = idx=>{
      if(lmeta[idx].blank) return idx;
      let end = idx;
      for(let j = idx + 1; j < dlines.length; j++){
        const t = dlines[j].text;
        if(!t.trim()){
          // 紧跟父项的缩进空行 = 回车刚生成、还没输入内容的子行, 也要算作子项;
          // 否则展开态箭头会在输入第一个字之前退回 ▸(展开态应恒为 ▾)
          if(j === idx + 1 && indentCol(t) > lmeta[idx].col) end = j;
          continue;
        }
        if(indentCol(t) <= lmeta[idx].col) break;
        end = j;
      }
      return end;   // 不吞掉子块末尾的空行, 留一行方便继续输入
    };
    const seen = new Map();
    const keys = new Map(), ends = new Map(), hidden = new Set();
    let hideUntil = -1;
    const mark = (idx, end)=>{
      const sig = lmeta[idx].indent + "|" + dlines[idx].text.trim().slice(0, 60);
      const occ = seen.get(sig) || 0; seen.set(sig, occ + 1);
      const key = (cur || "") + "|" + sig + "|" + occ;
      keys.set(idx, key); ends.set(idx, end);
      if(end > idx && collapsedKeys.has(key)){
        hideUntil = dlines[end].to;
        for(let k = idx + 2; k <= end + 1; k++) hidden.add(k);
      }
    };
    for(let i = 1; i <= st.doc.lines; i++){
      const line = st.doc.line(i);
      if(hideUntil >= 0 && line.from < hideUntil) continue;
      if(bskip && bskip.has(i)) continue;           // 代码块/表格/分割线内部不做折叠判断
      const txt = line.text, tr = txt.trim();
      if(tr.startsWith("$$") && !(tr.length >= 4 && tr.endsWith("$$"))){
        let j = i, end = null;
        for(j = i + 1; j <= st.doc.lines; j++){
          const L = st.doc.line(j);
          if(L.text.trim().endsWith("$$")){ end = L; break; }
        }
        if(end){ i = j; continue; }
      }
      if(tr === "\\begin{itemize}" || tr === "\\end{itemize}" ||
         tr === "\\begin{enumerate}" || tr === "\\end{enumerate}") continue;
      const hd = txt.match(/^(\s*)(#{1,3})(\s+)(.*)$/);
      if(hd){ const idx = i - 1, end = childEnd(idx); if(end > idx) mark(idx, end); continue; }
      const it = txt.match(/^(\s*)\\item\s?/);
      if(it){ const idx = i - 1, end = childEnd(idx); if(end > idx) mark(idx, end); continue; }
      // 显式折叠项: 行首(缩进后)的 \u200b 标记; 兼容旧写法 "- \u200b"。
      // 折叠父项不再要求是列表项, 子内容只凭缩进归属。
      const ex = txt.match(/^(\s*)(- )?\u200b(.*)$/);
      if(ex){ const idx = i - 1, end = childEnd(idx); mark(idx, end); continue; }
      const bl = txt.match(/^(\s*)- (.*)$/);
      if(bl){
        const idx = i - 1, end = childEnd(idx);
        if(end > idx) mark(idx, end);
        continue;
      }
      if(tr.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/)) continue;
      const idx = i - 1, end = childEnd(idx);
      if(end > idx) mark(idx, end);
    }
    return {dlines, lmeta, childEnd, keys, ends, hidden};
  }

  function buildDeco(st){
    const b = new S.RangeSetBuilder();
    const sel = st.selection;
    const ov = (f,t)=> sel.ranges.some(r => r.from < t && r.to > f);
    // 块级 widget 覆盖整行: 光标落在块首/块尾时也必须露出源码,
    // 否则块会把光标所在的 DOM 替换掉, 继续输入会丢字
    const ovBlock = (f,t)=> sel.ranges.some(r => r.from <= t && r.to >= f);
    // 行内公式 / 链接 / 代码 / 粗体 / 斜体统一扫描, 按优先级与位置排序后替换
    const scanInline = (line, off)=>{
      const txt = line.text, items = [];
      let m;
      const reM = /\$\$([^$\n]+)\$\$|\$([^$\n]+)\$/g;
      reM.lastIndex = off || 0;
      while((m = reM.exec(txt))){
        const from = line.from + m.index;
        items.push({from, to: from + m[0].length, kind:"math",
                    latex: m[1] !== undefined ? m[1] : m[2], display: m[1] !== undefined});
      }
      const reL = /\[([^\]\n]*)\]\(([^)\s]*)\)/g;
      reL.lastIndex = off || 0;
      while((m = reL.exec(txt))){
        if(m.index > 0 && txt[m.index - 1] === "!") continue;   // 图片语法不当作链接
        const text = m[1].trim(), url = m[2].trim();
        if(!text || !url) continue;                             // 未填完的链接保留源码方便编辑
        const from = line.from + m.index;
        items.push({from, to: from + m[0].length, kind:"link", text, url});
      }
      const reC = /`([^`\n]+)`/g;
      reC.lastIndex = off || 0;
      while((m = reC.exec(txt))){
        const from = line.from + m.index;
        items.push({from, to: from + m[0].length, kind:"code", text: m[1]});
      }
      const reB = /\*\*([^\n]+?)\*\*/g;
      reB.lastIndex = off || 0;
      while((m = reB.exec(txt))){
        if(!m[1].trim()) continue;
        const from = line.from + m.index;
        items.push({from, to: from + m[0].length, kind:"bold", text: m[1]});
      }
      const reI = /(?<!\*)\*([^*\n]+?)\*(?!\*)/g;
      reI.lastIndex = off || 0;
      while((m = reI.exec(txt))){
        if(!m[1].trim()) continue;
        const from = line.from + m.index;
        items.push({from, to: from + m[0].length, kind:"italic", text: m[1]});
      }
      const rank = {link: 4, code: 3, math: 2, bold: 1, italic: 0};
      items.sort((x, y)=>
        (rank[y.kind] - rank[x.kind]) || ((y.to - y.from) - (x.to - x.from)) || (x.from - y.from));
      const picked = [];
      for(const it of items){
        if(picked.some(x=> it.from < x.to && it.to > x.from)) continue;   // 嵌套时保留高优先级
        picked.push(it);
      }
      picked.sort((x, y)=> x.from - y.from);
      for(const it of picked){
        if(ov(it.from, it.to)) continue;                       // 光标在范围内时显示源码
        let widget;
        if(it.kind === "math") widget = new MathWidget(it.latex, it.display, it.from, it.to);
        else if(it.kind === "link") widget = new LinkWidget(it.text, it.url);
        else widget = new InlineMarkWidget(it.from, it.kind, it.text);
        b.add(it.from, it.to, V.Decoration.replace({widget}));
      }
    };
    // 块级结构（代码块 / 表格 / 分割线）与折叠关系一起预扫描
    const bs = blockScan(st);
    const {dlines, lmeta, childEnd, keys, ends, hidden} = foldScan(st, bs.skip);
    const addToggle = (idx, end, wFrom, wTo, replaceMarker, force, openEmpty)=>{
      const has = end > idx;
      if(!has && !force) return;
      const key = keys.get(idx);
      if(key === undefined) return;
      const widget = new ToggleWidget(key, collapsedKeys.has(key), dlines[idx].to,
                                      has ? dlines[idx+1].from : dlines[idx].to,
                                      has ? dlines[end].to : dlines[idx].to, has,
                                      !has && !!openEmpty, wFrom, wTo);
      if(replaceMarker){
        if(!ov(wFrom, wTo)) b.add(wFrom, wTo, V.Decoration.replace({widget}));
      } else if(!ov(wFrom, wFrom)){
        b.add(wFrom, wFrom, V.Decoration.widget({widget, side: -1}));
      }
      if(has && collapsedKeys.has(key)){
        const first = dlines[idx+1].from, last = dlines[end].to;
        if(!ovBlock(first, last)){
          b.add(first, last, V.Decoration.replace({block: true}));
        }
      }
    };
    let inEnum = false, enumN = 0;
    for(let i = 1; i <= st.doc.lines; i++){
      const line = st.doc.line(i);
      if(hidden.has(i)) continue;
      // 代码块 / 管道表 / 分割线: 整块替换成 widget; 光标进入时露出源码
      if(bs.starts.has(i)){
        const blk = bs.starts.get(i);
        if(!ovBlock(blk.from, blk.to)){
          let widget = null;
          if(blk.kind === "code") widget = new CodeBlockWidget(blk.from, blk.code, blk.lang);
          else if(blk.kind === "table") widget = new TableWidget(blk.from, blk.header, blk.align, blk.rows);
          else widget = new HrWidget(blk.from);
          if(widget) b.add(blk.from, blk.to, V.Decoration.replace({block:true, widget}));
        }
        continue;
      }
      if(bs.skip.has(i)) continue;
      const txt = line.text, tr = txt.trim();
      // 多行 $$ 公式块
      if(tr.startsWith("$$") && !(tr.length >= 4 && tr.endsWith("$$"))){
        let j = i, end = null;
        for(j = i+1; j <= st.doc.lines; j++){
          const L = st.doc.line(j);
          if(L.text.trim().endsWith("$$")){ end = L; break; }
        }
        if(end){
          const from = line.from, to = end.to;
          if(!ovBlock(from, to)){
            const inner = (txt.replace(/^\s*\$\$/, "") + "\n" +
                           st.doc.sliceString(line.to, end.from) + end.text.replace(/\$\$\s*$/, "")).trim();
            b.add(from, to, V.Decoration.replace({block:true, widget: new MathWidget(inner, true, from, to)}));
          }
          i = j;
          continue;
        }
      }
      // 隐藏 LaTeX 列表环境行
      if(tr === "\\begin{itemize}" || tr === "\\end{itemize}" ||
         tr === "\\begin{enumerate}" || tr === "\\end{enumerate}"){
        if(tr === "\\begin{enumerate}"){ inEnum = true; enumN = 0; }
        if(tr === "\\end{enumerate}"){ inEnum = false; }
        if(!ov(line.from, line.to)) b.add(line.from, line.from, V.Decoration.line({class:"cm-hide"}));
        continue;
      }
      // # / ## / ### 标题 → 明显加粗加大, 标记在不编辑时隐藏
      const hd = txt.match(/^(\s*)(#{1,3})(\s+)(.*)$/);
      if(hd){
        b.add(line.from, line.from, V.Decoration.line({class:"cm-h" + hd[2].length}));
        const mk = hd[1].length + hd[2].length + hd[3].length;   // 缩进 + # + 空格
        const mFrom = line.from + hd[1].length, mEnd = line.from + mk;
        if(!ov(mFrom, mEnd)) b.add(mFrom, mEnd, V.Decoration.replace({}));
        const idx = i - 1, end = childEnd(idx);
        if(end > idx) addToggle(idx, end, line.from, line.from, false);
        scanInline(line, mk);
        continue;
      }
      // \item → 项目符号（内容仍是普通可编辑文本）; 带缩进子项的可折叠
      const it = txt.match(/^(\s*)\\item\s?/);
      if(it){
        if(inEnum) enumN++;
        const a = line.from + it[1].length, z = line.from + it[0].length;
        const idx = i - 1, end = childEnd(idx);
        if(end > idx) addToggle(idx, end, a, z, true);
        else if(!ov(a, z)){
          // 空列表项: 光标在本行时立即显示圆点; 只有光标不在该行且确实无内容时才不画
          const empty = !txt.slice(it[0].length).trim();
          if(empty && st.doc.lineAt(sel.main.head).number !== i)
            b.add(a, z, V.Decoration.replace({}));
          else
            b.add(a, z, V.Decoration.replace({widget: new BulletWidget(inEnum ? enumN + ". " : "•")}));
        }
        scanInline(line, it[0].length);
        continue;
      }
      // 显式折叠项: 行内 \u200b 标记(兼容旧的 "- \u200b")。
      // 折叠与列表解耦: 不画项目符号, 箭头直接替换标记, 子内容只凭缩进归属。
      const ex = txt.match(/^(\s*)(- )?\u200b(.*)$/);
      if(ex){
        const indentLen = ex[1].length;
        const mk = ex[0].length - ex[3].length;        // 缩进 + 可选 "- " + \u200b
        const a = line.from + indentLen, z = line.from + mk;
        const markerPos = line.from + indentLen + (ex[2] ? 2 : 0);
        const idx = i - 1, end = childEnd(idx);
        addToggle(idx, end, a, z, true, true, openFoldMarkers.has(markerPos));
        scanInline(line, mk);
        continue;
      }
      // - 列表 → 项目符号; 带缩进子项的作为可折叠 toggle
      const bl = txt.match(/^(\s*)- (.*)$/);
      if(bl){
        const mk = bl[1].length + 2;                    // 缩进 + "- "
        const a = line.from + bl[1].length, z = line.from + mk;
        const idx = i - 1, end = childEnd(idx);
        if(end > idx) addToggle(idx, end, a, z, true);
        else if(!ov(a, z)){
          // 空列表项: 光标在本行时立即显示圆点; 只有光标不在该行且确实无内容时才不画
          const empty = !bl[2].trim();
          if(empty && st.doc.lineAt(sel.main.head).number !== i)
            b.add(a, z, V.Decoration.replace({}));
          else
            b.add(a, z, V.Decoration.replace({widget: new BulletWidget("•")}));
        }
        scanInline(line, mk);
        continue;
      }
      // 整行图片 → 直接显示缩略图(保留该行缩进, 折叠内也显示在子层级)
      const im = txt.match(/^(\s*)!\[([^\]]*)\]\(([^)\s]+)\)$/);
      if(im){
        if(!ovBlock(line.from, line.to))
          b.add(line.from, line.to, V.Decoration.replace({block:true, widget: new ImgWidget(im[3], im[2], im[1].length, line.from, line.to)}));
        continue;
      }
      // > 引用: 隐藏 > 标记, 整行加左侧色条
      const qm = txt.match(/^(\s*)>( ?)(.*)$/);
      if(qm){
        const qFrom = line.from + qm[1].length;
        const qTo = line.from + qm[0].length - qm[3].length;
        b.add(line.from, line.from, V.Decoration.line({class:"cm-quote-line"}));
        // 光标在本行时露出 > 源码便于编辑; 离开本行后隐藏标记
        if(st.doc.lineAt(sel.main.head).number !== i) b.add(qFrom, qTo, V.Decoration.replace({}));
        scanInline(line, qTo - line.from);
        continue;
      }
      // 普通段落: 只要下面有缩进内容, 也生成折叠箭头
      const gi = i - 1, gend = childEnd(gi);
      if(gend > gi) addToggle(gi, gend, line.from + lmeta[gi].indent, line.from + lmeta[gi].indent, false);
      scanInline(line, 0);
    }
    return b.finish();
  }

  function buildEditor(){
    box.innerHTML = "";
    // 折叠箭头按“4 个空格”的实测宽度占位: 子行缩进也是 4 个空格,
    // 这样展开后子内容左边缘与折叠标题文字对齐(箭头不额外多缩一层)
    try{
      const probe = document.createElement("span");
      probe.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;"
        + "font:14px/1.8 \"Segoe UI\",\"Microsoft YaHei\",system-ui,sans-serif";
      probe.textContent = "    ";
      document.body.appendChild(probe);
      const w = probe.getBoundingClientRect().width;
      probe.remove();
      if(w > 8){
        document.documentElement.style.setProperty("--togw", w.toFixed(2) + "px");
        document.documentElement.style.setProperty("--spw", (w / 4).toFixed(2) + "px");
      }
    }catch(e){}
    const theme = V.EditorView.theme({
      "&": {height:"100%", fontSize:"14px", background:"#fff", color:"#1a1d29"},
      "&.cm-focused": {outline:"none"},
      ".cm-scroller": {fontFamily:'"Segoe UI","Microsoft YaHei",system-ui,sans-serif', lineHeight:"1.8", overflow:"auto"},
      // 底部留白: 文档末尾之下还能再滚约 2/3 屏, 最后一行可以停在视口中上部;
      // 留白放在编辑器 content 内(cm-scroller 自带 overflow:auto), 外层布局与滚动条不受影响
      ".cm-content": {padding:"10px 12px 66vh", caretColor:"#1a1d29"},
      ".cm-line": {padding:"1px 0"},
      ".cm-cursor": {borderLeftColor:"#1a1d29"},
      ".cm-selectionBackground, ::selection": {background:"#dfe5ff !important"},
      ".cm-math-inline": {cursor:"pointer", borderRadius:"4px", padding:"0 1px"},
      ".cm-math-inline:hover": {background:"#eef2ff"},
      ".cm-math-block": {display:"block", textAlign:"center", margin:"6px 0", padding:"4px 0", cursor:"pointer", borderRadius:"6px", overflowX:"auto"},
      ".cm-math-block:hover": {background:"#f6f7ff"},
      ".cm-img": {display:"block", maxWidth:"100%", maxHeight:"300px", margin:"6px 0", borderRadius:"8px", cursor:"zoom-in", boxShadow:"0 1px 6px rgba(0,0,0,.12)"},
      ".cm-bullet": {display:"inline-block", minWidth:"12px", textAlign:"center", color:"#4f46e5", fontWeight:"700", paddingRight:"4px"},
      ".cm-link": {color:"#4f46e5", textDecoration:"underline", cursor:"pointer", textUnderlineOffset:"2px"},
      ".cm-link:hover": {color:"#312e81", background:"#eef2ff", borderRadius:"3px"},
      ".cm-toggle": {display:"inline-block", width:"var(--togw,16px)", textAlign:"center", color:"#4f46e5", fontWeight:"700", paddingRight:"0", cursor:"pointer", fontSize:"14px", userSelect:"none", lineHeight:"1.2"},
      ".cm-toggle:hover": {color:"#312e81"},
      ".cm-toggle-empty": {color:"#9aa0c8"},
      ".cm-toggle-open": {color:"#7c83d6"},
      ".cm-h1": {fontSize:"22px", fontWeight:"700", lineHeight:"1.55"},
      ".cm-h2": {fontSize:"19px", fontWeight:"700", lineHeight:"1.55"},
      ".cm-h3": {fontSize:"16.5px", fontWeight:"700", lineHeight:"1.55"},
      ".cm-hide": {fontSize:"0 !important", lineHeight:"0 !important"}
    });
    const deco = S.StateField.define({
      create: st => buildDeco(st),
      update: (val, tr) => (tr.docChanged || tr.selection || tr.effects.length) ? buildDeco(tr.state) : val,
      provide: f => V.EditorView.decorations.from(f)
    });
    const st = S.EditorState.create({
      doc: src,
      extensions: [
        C.history(),
        S.Prec.high(V.keymap.of([
          {key:"Mod-s", run(){ saveNow(); return true; }},
          {key:"Enter", run: enterList},
          {key:"Backspace", run: backspaceMarker},
          {key:"Delete", run: deleteMarker}
        ])),
        V.keymap.of([...C.defaultKeymap, ...C.historyKeymap,
                     {key:"Tab", run: C.indentMore}, {key:"Shift-Tab", run: C.indentLess}]),
        V.drawSelection(), V.dropCursor(), V.EditorView.lineWrapping,
        theme, deco,
        V.EditorView.updateListener.of(u=>{
          if(u.docChanged) markDirty();
          if(u.docChanged || u.selectionSet) updateMenu(u.view);
        })
      ]
    });
    view = new V.EditorView({state: st, parent: box});
    view.contentDOM.addEventListener("paste", onPaste, true);
    view.dom.addEventListener("drop", onDrop, true);
    // 选中文字后键入 / 会立刻替换掉选区: 在输入发生前先记下原文字, 供「链接」命令还原
    view.contentDOM.addEventListener("keydown", e=>{
      if(e.key !== "/" || e.ctrlKey || e.altKey || e.metaKey) return;
      const sel = view.state.selection.main;
      pendingLinkSel = sel.empty ? null
        : {text: view.state.sliceDoc(sel.from, sel.to), from: sel.from, to: sel.to};
    }, true);
    view.contentDOM.addEventListener("keydown", onMenuKey, true);
    // 菜单打开时点击别处/失焦都视为取消, 清掉 / 命令残留
    view.contentDOM.addEventListener("mousedown", ()=>{ if(menuVisible) cancelSlash(view); }, true);
    view.contentDOM.addEventListener("blur", ()=>setTimeout(()=>{ if(menuVisible) cancelSlash(view); }, 150));
  }

  function enterList(vw){
    if(vw.composing) return false; // 中文输入法组合态下的回车用于确认候选词, 不续写列表
    const st = vw.state, sel = st.selection.main;
    if(!sel.empty) return false;
    const line = st.doc.lineAt(sel.head);
    if(sel.head !== line.to){
      // 光标在行中: 折叠子行(纯缩进普通行)回车也保持该缩进, 不在行尾也不会掉回行首
      const plain = !/^(\s*)(- )?\u200b/.test(line.text) && !/^(\s*)\\item\s?/.test(line.text)
                 && !/^(\s*)- /.test(line.text) && !/^(\s*)(#{1,3}\s)/.test(line.text);
      const ind = (line.text.match(/^\s*/) || [""])[0];
      if(plain && ind){
        const ins = "\n" + ind;
        vw.dispatch({changes:{from:sel.head, insert:ins},
                     selection:{anchor:sel.head + ins.length}, scrollIntoView:true});
        return true;
      }
      return false;
    }
    // 当前行的折叠状态: 是折叠父项 / 是否有子项 / 是否处于收起状态
    const fs = foldScan(st, blockScan(st).skip);
    const idx = line.number - 1;
    const key = fs.keys.get(idx), end = fs.ends.get(idx);
    const hasChildren = end !== undefined && end > idx;
    const collapsed = hasChildren && collapsedKeys.has(key);
    // 生成无项目符号的普通行: 折叠子内容只靠缩进归属, 不回填 "- " 或 "\item"
    const plainLine = (indent, at)=>{
      const ins = "\n" + indent;
      vw.dispatch({changes:{from:at, insert:ins},
                   selection:{anchor:at+ins.length}, scrollIntoView:true});
      return true;
    };
    // 1) 显式折叠项(含旧的 "- \u200b"): 展开 -> 缩进一层普通行; 收起 -> 同级普通行
    const ex = line.text.match(/^(\s*)(- )?\u200b(.*)$/);
    if(ex){
      const indent = ex[1];
      const markerPos = line.from + indent.length + (ex[2] ? 2 : 0);
      const open = openFoldMarkers.has(markerPos);
      openFoldMarkers.delete(markerPos);
      if(collapsed) return plainLine(indent, fs.dlines[end].to);   // 插到整个子块之后
      // 子行缩进 4 个空格: 折叠箭头正好占 4 个空格的宽度, 子内容左边缘与标题文字对齐
      if(open || hasChildren) return plainLine(indent + "    ", sel.head);
      return plainLine(indent, sel.head);
    }
    // 2) LaTeX \item 列表: 空项回车只退出列表层(缩进保留, 仍在折叠子空间), 一步只退一级
    const li = line.text.match(/^(\s*)\\item\s?(.*)$/);
    if(li){
      if(!li[2].trim()){
        vw.dispatch({changes:{from:line.from, to:line.to, insert:li[1]},
                     selection:{anchor:line.from + li[1].length}, scrollIntoView:true});
        return true;
      }
      if(collapsed){
        const from = fs.dlines[end].to;
        const ins = "\n" + li[1] + "\\item ";
        vw.dispatch({changes:{from, insert:ins}, selection:{anchor:from+ins.length}, scrollIntoView:true});
      } else {
        const ins = "\n" + li[1] + (hasChildren ? "    " : "") + "\\item ";
        vw.dispatch({changes:{from:sel.head, insert:ins}, selection:{anchor:sel.head+ins.length}, scrollIntoView:true});
      }
      return true;
    }
    // 3) Markdown "- " 列表: 回车同级续写; 空列表项回车只退出列表层(缩进保留, 仍在折叠子空间)
    const m = line.text.match(/^(\s*)- (.*)$/);
    if(m){
      if(!m[2].trim()){
        vw.dispatch({changes:{from:line.from, to:line.to, insert:m[1]},
                     selection:{anchor:line.from + m[1].length}, scrollIntoView:true});
        return true;
      }
      if(collapsed){
        const from = fs.dlines[end].to;
        const ins = "\n" + m[1] + "- ";
        vw.dispatch({changes:{from, insert:ins}, selection:{anchor:from+ins.length}, scrollIntoView:true});
      } else {
        const ins = "\n" + m[1] + "- ";
        vw.dispatch({changes:{from:sel.head, insert:ins}, selection:{anchor:sel.head+ins.length}, scrollIntoView:true});
      }
      return true;
    }
    // 4) 其它折叠父项(普通段落 / 标题): 展开 -> 缩进普通行; 收起 -> 同级普通行(插到子块之后)
    const indent = (line.text.match(/^\s*/) || [""])[0];
    if(hasChildren){
      if(collapsed) return plainLine(indent, fs.dlines[end].to);
      return plainLine(indent + "    ", sel.head);
    }
    // 5) 已缩进的普通行(折叠子内容): 回车保持同级缩进继续输入; 空行回车则退出子空间
    if(indent){
      if(!line.text.trim()){
        // 空行再回车 = 退出子空间: 当前空行的缩进收回一级, 光标落到父级行
        const parent = indent.length >= 4 ? indent.slice(0, indent.length - 4) : "";
        vw.dispatch({changes:{from:line.from, to:sel.head, insert:"\n"+parent},
                     selection:{anchor:line.from + 1 + parent.length}, scrollIntoView:true});
        return true;
      }
      return plainLine(indent, sel.head);
    }
    return false;
  }

  // 整行只剩格式标记(没有任何可见内容)时, 返回 {len, indent, fold}; 否则 null。
  // 用于「删掉最后一个可见字符 -> 标记同时消失」: 清空整行只保留缩进, 光标落在行首。
  function markerOnlyInfo(txt){
    if(!txt.trim()) return null;
    let m;
    if((m = txt.match(/^(\s*)(- )?\u200b\s*$/))) return {len:m[0].length, indent:m[1], fold:true};
    if((m = txt.match(/^(\s*)#{1,3}\s*$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)- \s*$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)\\item\s?$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)>\s?$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)---\s*$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)```[A-Za-z0-9_+.\-]*\s*$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)\$\$\s*$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)\|[\s|:\-]*\|\s*$/))) return {len:m[0].length, indent:m[1]};
    if((m = txt.match(/^(\s*)\[\]\([^)]*\)\s*$/))) return {len:m[0].length, indent:m[1]};
    return null;
  }
  // 该折叠标记行是否还挂着子内容; 有子内容时不能把标记删掉, 否则子项变成孤儿
  function foldHasChildren(st, pos){
    const fs = foldScan(st, blockScan(st).skip);
    const idx = st.doc.lineAt(pos).number - 1;
    const end = fs.ends.get(idx);
    return end !== undefined && end > idx;
  }
  // 清空整行标记, 只保留原缩进(折叠子行仍在子空间内), 光标落到该行行首(缩进后)
  function clearMarkerLine(vw, line, info){
    vw.dispatch({changes:{from:line.from, to:line.to, insert:info.indent},
                 selection:{anchor:line.from + info.indent.length}, scrollIntoView:true});
    return true;
  }
  function backspaceMarker(vw){
    if(vw.composing) return false; // 输入法组合态交给输入法处理
    const st = vw.state, sel = st.selection.main;
    if(!sel.empty){
      // 有选区(全选整行 / 选中可见文字)删除: 若删完只剩标记, 连同标记一起清掉
      const ln0 = st.doc.lineAt(sel.from);
      if(sel.to <= ln0.to){
        const after = ln0.text.slice(0, sel.from - ln0.from) + ln0.text.slice(sel.to - ln0.from);
        const info = markerOnlyInfo(after);
        if(info){
          if(info.fold && foldHasChildren(st, ln0.from)) return false;
          return clearMarkerLine(vw, ln0, info);
        }
      }
      return false;
    }
    const line = st.doc.lineAt(sel.head);
    let mk = 0, isFold = false;
    const li = line.text.match(/^(\s*)\\item\s?/);
    if(li) mk = li[0].length;                       // \item + 一个空格
    else {
      // 显式折叠标记: \u200b 或旧的 "- \u200b"
      const ex = line.text.match(/^(\s*)(- )?\u200b/);
      if(ex){ mk = ex[0].length; isFold = true; }
      else {
        const b = line.text.match(/^(\s*)- /);
        if(b) mk = b[0].length;                     // - + 空格
      }
    }
    if(mk){
      const end = line.from + mk;
      // 仅当光标紧贴标记末尾时整体删除(含缩进); 其它位置保持正常字符退格
      if(sel.head === end){
        // 折叠项下面还有子内容: 不允许删掉标记, 否则子项变孤儿
        if(isFold && foldHasChildren(st, line.from)) return true;
        vw.dispatch({changes:{from:line.from, to:end, insert:""},
                     selection:{anchor:line.from}, scrollIntoView:true});
        return true;
      }
    }
    const rel = sel.head - line.from;
    // 1) 本行内容已空、只剩标记: 一次退格清掉整段标记
    if(rel === line.text.length){
      const info = markerOnlyInfo(line.text);
      if(info){
        if(info.fold && foldHasChildren(st, line.from)) return true;   // 有子内容: 标记保留
        return clearMarkerLine(vw, line, info);
      }
    }
    // 2) 这一步要删的是最后一个可见字符, 删完只剩标记: 连同标记一起清掉(同一次撤销)
    if(rel > 0){
      const after = line.text.slice(0, rel - 1) + line.text.slice(rel);
      const info = markerOnlyInfo(after);
      if(info){
        if(info.fold && foldHasChildren(st, line.from)) return false;  // 保留折叠结构, 交给默认退格
        return clearMarkerLine(vw, line, info);
      }
    }
    return false;
  }
  // Delete(向前删)同样适用: 行首整段标记 / 删掉最后一个可见字符
  function deleteMarker(vw){
    if(vw.composing) return false;
    const st = vw.state, sel = st.selection.main;
    if(!sel.empty){
      // 有选区删除: 若删完只剩标记, 连同标记一起清掉
      const ln0 = st.doc.lineAt(sel.from);
      if(sel.to <= ln0.to){
        const after = ln0.text.slice(0, sel.from - ln0.from) + ln0.text.slice(sel.to - ln0.from);
        const info = markerOnlyInfo(after);
        if(info){
          if(info.fold && foldHasChildren(st, ln0.from)) return false;
          return clearMarkerLine(vw, ln0, info);
        }
      }
      return false;
    }
    const line = st.doc.lineAt(sel.head);
    if(sel.head === line.from){
      const info = markerOnlyInfo(line.text);
      if(info){
        if(info.fold && foldHasChildren(st, line.from)) return true;   // 有子内容: 标记保留
        return clearMarkerLine(vw, line, info);
      }
    }
    if(sel.head < line.to){
      const rel = sel.head - line.from;
      const after = line.text.slice(0, rel) + line.text.slice(rel + 1);
      const info = markerOnlyInfo(after);
      if(info){
        if(info.fold && foldHasChildren(st, line.from)) return false;
        return clearMarkerLine(vw, line, info);
      }
    }
    return false;
  }

  // ---------- / 命令菜单 ----------
  function hideMenu(){ menu.style.display = "none"; menuVisible = false; menuItems = []; menuKey = ""; pendingLinkSel = null; }
  // ---------- 图片右键菜单 ----------
  function hideImgMenu(){ if(imgMenu) imgMenu.style.display = "none"; }
  function showImgMenu(x, y, onDelete){
    if(!imgMenu) return;
    imgMenu.innerHTML = "";
    const it = document.createElement("div");
    it.className = "mi"; it.textContent = "🗑 删除图片";
    it.addEventListener("mousedown", e=>{
      e.preventDefault(); e.stopPropagation();
      hideImgMenu(); onDelete();
    });
    imgMenu.appendChild(it);
    imgMenu.style.display = "block";
    imgMenu.style.left = "0px"; imgMenu.style.top = "0px";
    // 贴边时反向收进视口, 避免菜单被裁掉
    const mw = imgMenu.offsetWidth, mh = imgMenu.offsetHeight;
    imgMenu.style.left = Math.max(4, Math.min(x, window.innerWidth - mw - 8)) + "px";
    imgMenu.style.top = Math.max(4, Math.min(y, window.innerHeight - mh - 8)) + "px";
    setTimeout(()=>{
      document.addEventListener("mousedown", hideImgMenu, {capture:true, once:true});
      window.addEventListener("scroll", hideImgMenu, {capture:true, once:true});
      document.addEventListener("keydown", e=>{ if(e.key === "Escape") hideImgMenu(); }, {capture:true, once:true});
    }, 0);
  }
  function slashAt(vw){
    const sel = vw.state.selection.main;
    if(!sel.empty) return null;
    const pos = sel.head, line = vw.state.doc.lineAt(pos);
    const before = line.text.slice(0, pos - line.from);
    const m = before.match(/(?:^|\s)\/([^\s/]*)$/);
    if(m) return {start: pos - m[1].length - 1, pos, q: m[1]};
    // 选中文字后直接键入 / 时, / 前一个字符可能不是空白, 仍按 /命令 处理
    if(pendingLinkSel && pos > pendingLinkSel.from){
      const seg = line.text.slice(pendingLinkSel.from - line.from, pos - line.from);
      const mm = seg.match(/^\/([^\s/]*)$/);
      if(mm) return {start: pendingLinkSel.from, pos, q: mm[1]};
    }
    return null;
  }
  function removeSlash(vw, s){
    vw.dispatch({changes:{from:s.start, to:s.pos, insert:""}, selection:{anchor:s.start}});
  }
  // 取消斜杠命令时把触发用的 /查询 一起清掉, 不留残留
  function cancelSlash(vw){
    if(!menuVisible) return;
    const s = slashAt(vw);
    hideMenu();
    if(s){ removeSlash(vw, s); vw.focus(); }
  }
  function updateMenu(vw){
    const s = slashAt(vw);
    if(!s){ hideMenu(); return; }
    const q = s.q.toLowerCase();
    menuItems = SLASH_CMDS.filter(c => !q || c.name.toLowerCase().includes(q) || c.kw.includes(q));
    if(!menuItems.length){ hideMenu(); return; }
    const key = s.start + "|" + q;
    if(key !== menuKey) menuSel = 0;    // 新开菜单/改查询时高亮回到第一项, 不复用上次的选择
    menuKey = key;
    menuSel = Math.max(0, Math.min(menuSel, menuItems.length - 1));
    menu.innerHTML = menuItems.map((c,i)=>
      `<div class="si${i===menuSel?" sel":""}" data-i="${i}"><span class="ic">${esc(c.ic)}</span>
        <span><div class="nm">${esc(c.name)}</div><div class="ds">${esc(c.desc)}</div></span></div>`).join("");
    const co = vw.coordsAtPos(s.pos) || {left: innerWidth/2, bottom: innerHeight/2};
    menu.style.left = Math.max(4, Math.min(co.left, innerWidth-268)) + "px";
    menu.style.top = Math.max(4, Math.min(co.bottom+2, innerHeight-262)) + "px";
    menu.style.display = "block"; menuVisible = true;
    menu.querySelectorAll(".si").forEach(it=>{
      it.onmousedown = e=>{ e.preventDefault(); applyCmd(vw, menuItems[+it.dataset.i]); };
    });
  }
  function applyCmd(vw, c){
    if(!c) return;
    const pickedSel = pendingLinkSel;
    const s = slashAt(vw);
    hideMenu();
    if(c.act === "img"){
      if(s) removeSlash(vw, s);
      imgInput.click(); return;
    }
    if(!s) return;
    if(c.act === "link"){
      // 有选中文字 -> 还原原文并插入 [文字](url), 光标停在 ( ) 内;
      // 无选中文字 -> 插入 [](), 光标停在 [ ] 内
      const picked = pickedSel && pickedSel.from === s.start;
      const txt = picked ? pickedSel.text : "";
      const ins = picked ? `[${txt}]()` : "[]()";
      const anchor = picked ? s.start + txt.length + 3 : s.start + 1;
      vw.dispatch({changes:{from:s.start, to:s.pos, insert:ins},
                   selection:{anchor}, scrollIntoView:true});
      vw.focus(); return;
    }
    if(c.head){
      // 标题命令: 整行改写, 清掉已有的 # 标记和 /命令
      const st = vw.state, line = st.doc.lineAt(s.pos);
      const indent = (line.text.match(/^\s*/) || [""])[0];
      const lead = line.text.slice(indent.length, s.start - line.from).replace(/^#{1,6}\s+/, "");
      const tail = line.text.slice(s.pos - line.from);
      const text = indent + c.head + " " + lead + tail;
      const caret = line.from + indent.length + c.head.length + 1 + lead.length;
      vw.dispatch({changes:{from:line.from, to:line.to, insert:text},
                   selection:{anchor:caret}, scrollIntoView:true});
      vw.focus(); return;
    }
    const [ins, after, caretRel] = c.ins();
    // 多行命令(如公式块)插入时, 后续行带上当前行的缩进:
    // 缩进不改变命令行为, 插在折叠内也能整体留在该层级里
    const indent = (vw.state.doc.lineAt(s.pos).text.match(/^\s*/) || [""])[0];
    const full = ins + after;
    const insNorm = full.split("\n").map((ln, i)=> i === 0 ? ln : indent + ln).join("\n");
    let caretRaw = caretRel !== undefined ? caretRel : ins.length;
    let extra = 0;
    if(indent) for(let i = 0; i < caretRaw && i < full.length; i++) if(full[i] === "\n") extra += indent.length;
    const anchor = s.start + caretRaw + extra;
    vw.dispatch({changes:{from:s.start, to:s.pos, insert:insNorm},
                 selection:{anchor}, scrollIntoView:true});
    vw.focus();
  }
  function onMenuKey(e){
    if(!menuVisible) return;
    if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); cancelSlash(view); return; }
    // 菜单打开时再输入 / 视为误触, 直接吞掉, 避免留下 "//"
    if(e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault(); e.stopPropagation(); return;
    }
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault(); e.stopPropagation();
      menuSel = (menuSel + (e.key === "ArrowDown" ? 1 : menuItems.length - 1)) % menuItems.length;
      updateMenu(view); return;
    }
    if(e.key === "Enter" || e.key === "Tab"){
      e.preventDefault(); e.stopPropagation();
      applyCmd(view, menuItems[menuSel]);
    }
  }

  // ---------- 图片 ----------
  async function uploadImage(file){
    if(!file) return;
    let url = "";
    try{ url = (await api.noteImg(cid, file)).url; }
    catch(e){ alert("图片上传失败：" + (e.message || e)); return; }
    const line = `![图片](${url})`;
    if(view){
      const pos = view.state.selection.main.head;
      const ln = view.state.doc.lineAt(pos);
      // 缩进行里插图片: 图片行与后续行都带上当前行缩进, 不会跑到折叠外/掉回行首
      const indent = (ln.text.match(/^\s*/) || [""])[0];
      const ins = (ln.text.trim() ? "\n" + indent : "") + line + "\n" + (indent || "");
      view.dispatch({changes:{from:pos, insert:ins}, selection:{anchor:pos+ins.length}, scrollIntoView:true});
      view.focus();
    } else if(fallback){
      const p = fallback.selectionStart;
      fallback.value = fallback.value.slice(0,p) + "\n" + line + "\n" + fallback.value.slice(p);
      markDirty();
    }
  }
  function onPaste(e){
    const it = [...(e.clipboardData?.items || [])].find(x => x.type.startsWith("image/"));
    if(it){
      e.preventDefault(); e.stopPropagation();
      uploadImage(it.getAsFile());
      return;
    }
    // 多行文本粘贴: 在缩进行里让后续行沿用当前缩进(与折叠外的默认粘贴行为一致, 只是多保留缩进)
    const txt = e.clipboardData?.getData("text/plain");
    if(!view || !txt || !txt.includes("\n")) return;
    const st = view.state, sel = st.selection.main;
    if(!sel.empty) return;                    // 有选区(整体替换)时交给默认粘贴
    const line = st.doc.lineAt(sel.from);
    const indent = (line.text.match(/^\s*/) || [""])[0];
    if(!indent) return;                       // 行首无缩进时完全交给默认粘贴
    e.preventDefault(); e.stopPropagation();
    const body = txt.replace(/\r\n?/g, "\n").split("\n").map((ln, i)=> i === 0 ? ln : indent + ln).join("\n");
    view.dispatch({changes:{from:sel.from, to:sel.to, insert:body},
                   selection:{anchor:sel.from + body.length}, scrollIntoView:true});
    view.focus();
  }
  function onDrop(e){
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f || !f.type.startsWith("image/")) return;
    e.preventDefault(); e.stopPropagation();
    uploadImage(f);
  }

  // ---------- 文件读写 / 自动保存 ----------
  let epoch = 0, savePromise = null;
  function fileLabel(){ return cur || (newEl.value.trim() || "课堂笔记"); }
  function getText(){ return view ? view.state.doc.toString() : (fallback ? fallback.value : src); }
  function setStatus(t){ if(whereEl) whereEl.textContent = t; }
  function markDirty(){
    if(suppress) return;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ saveTimer = null; flushSave(); }, 900);   // 防抖: 停手约1秒后落盘
    setStatus(cur ? `notes/${cur}.md · 编辑中，稍后自动保存` : "新笔记 · 编辑中，稍后自动保存");
  }
  function saveNow(){
    clearTimeout(saveTimer); saveTimer = null;
    return flushSave();
  }
  async function flushSave(){
    if(saving) return savePromise || undefined;
    const name = fileLabel(), content = getText();
    if(!dirty || lastSaved === content) return;
    const myEpoch = epoch;
    saving = true;
    setStatus("保存中…");
    let ok = false;
    try{
      savePromise = chainNoteSave(cid + "/" + name, ()=>api.mdSave(cid, name, content));
      const j = await savePromise;
      ok = true;
      if(myEpoch === epoch){                 // 已切换到别的文件则不回写界面状态
        cur = j.name; lastSaved = content;
        dirty = (getText() !== content);     // 保存期间又输入了内容 -> 再存一次
        setStatus(`已自动保存 · notes/${cur}.md`);
        await syncOptions(cur);
      }
    }catch(e){
      if(myEpoch === epoch) setStatus("自动保存失败：" + (e && e.message ? e.message : e));
    }finally{
      saving = false; savePromise = null;
    }
    // 成功但仍有未落盘内容(或切文件期间产生的新修改)时重新排队
    if(dirty && (ok || myEpoch !== epoch)) markDirty();
  }
  function setText(text){
    src = text;
    suppress = true;
    try{
      if(view){
        view.dispatch({changes:{from:0, to:view.state.doc.length, insert:text}, selection:{anchor:0}, scrollIntoView:true});
      } else if(fallback){
        fallback.value = text;
      }
    }finally{ suppress = false; }
    dirty = false; lastSaved = text;
  }
  async function syncOptions(want){
    // 只列用户自己写的 md; 讲课复现/思维导图/实时要点是 AI 产物, 不混进"我的笔记"
    const files = (await api.mdList(cid)).filter(f=>!isAiNote(f));
    selEl.innerHTML = files.length
      ? files.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("")
      : `<option value="">（空）首次输入将自动创建 课堂笔记.md</option>`;
    const keep = want || cur;
    if(keep && files.includes(keep)) selEl.value = keep;
  }
  async function refresh(want){
    await syncOptions(want);
    await load();
  }
  async function load(){
    epoch++;
    clearTimeout(saveTimer); saveTimer = null;
    const name = selEl.value;
    if(!name){
      cur = null; setText("");
      setStatus("输入内容会自动创建并保存为 课堂笔记.md");
      return;
    }
    const j = await api.mdRead(cid, name);
    cur = j.name; setText(j.content);
    setStatus(`当前文件：notes/${cur}.md（内容自动保存）`);
  }

  // 页面关闭/切走前尽力落盘
  function flushOnExit(){
    if(!dirty || saving) return;
    const name = fileLabel(), content = getText();
    if(!content && !cur) return;
    try{
      const blob = new Blob([JSON.stringify({name, content})], {type:"application/json"});
      navigator.sendBeacon(`/api/courses/${cid}/mdfile`, blob);
      dirty = false; lastSaved = content;
    }catch(e){}
  }
  window.addEventListener("pagehide", flushOnExit);
  window.addEventListener("beforeunload", flushOnExit);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden" && dirty && !saving) saveNow();
  });

  selEl.onchange = async ()=>{
    if(dirty && !confirm("当前内容会先自动保存，切换文件？")){ selEl.value = cur || ""; return; }
    if(dirty) await flushSave();
    if(savePromise) await savePromise.catch(()=>{});
    await load();
  };
  imgInput.onchange = ()=>{ uploadImage(imgInput.files[0]); imgInput.value = ""; };
  $("#ncreate").onclick = async ()=>{
    const name = newEl.value.trim(); if(!name) return newEl.focus();
    if(dirty) await flushSave();
    const j = await api.mdSave(cid, name, "");
    await refresh(j.name);
  };
  $("#ndel").onclick = async ()=>{
    if(!cur || !confirm(`删除 ${cur} ?`)) return;
    clearTimeout(saveTimer); saveTimer = null; dirty = false;
    await api.mdDel(cid, cur); await refresh();
  };

  await init();
}

const COVER_PRESETS = [
  {id:"p1", name:"靛蓝", bg:"linear-gradient(135deg,#4f46e5,#7c3aed)"},
  {id:"p2", name:"海蓝", bg:"linear-gradient(135deg,#0ea5e9,#2563eb)"},
  {id:"p3", name:"青绿", bg:"linear-gradient(135deg,#059669,#0d9488)"},
  {id:"p4", name:"暖橙", bg:"linear-gradient(135deg,#f97316,#db2777)"},
  {id:"p5", name:"深灰", bg:"linear-gradient(135deg,#334155,#0f172a)"},
  {id:"p6", name:"雾白", bg:"linear-gradient(135deg,#cbd5e1,#94a3b8)"},
];
const PAGE_BGS = ["#f5f6fa", "#edf0f7", "#e6ebf6", "#dfe6f3", "#d7e0f0"];
// 有底图时, 深浅 = 白色蒙层浓度(空白区域最浅, 内容面板固定更浅一档)
const PAGE_VEIL = [0.06, 0.18, 0.30, 0.42, 0.55];
const _lerp = (a,b,t)=>a+(b-a)*t;
function _hexRGB(hex){
  const h = hex.replace("#","");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
// 0-100 连续取值: 在 5 个原锚点之间线性插值, 旧观感完全保留但不再跳档。
// 关键: input.value 永远是字符串("37.5"), 不能再把字符串一律当成旧五档索引,
// 否则 0-5% 被 parseInt 夹到 0..4 档, 5% 以上全部变成 100% (看起来毫无变化)。
function bgShadeVal(v){
  const n = parseFloat(v);
  return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0;
}
// 仅后端遗留的 "0".."4" 单字符才表示旧五档; 新版存的是数字 0-100
function bgShadeFromMeta(v){
  if(typeof v === "string" && /^[0-4]$/.test(v.trim())) return parseInt(v,10) / 4 * 100;
  return bgShadeVal(v);
}
let BG_KEEP = null;   // 当前底图 URL: 任何操作都不该把它弄丢
function applyPageBg(img, val){
  BG_KEEP = img || null;
  const v = bgShadeVal(val);
  const pos = v / 100 * (PAGE_VEIL.length - 1);   // 0..4 的浮点档位
  const lo = Math.min(PAGE_VEIL.length - 1, Math.floor(pos));
  const hi = Math.min(PAGE_VEIL.length - 1, lo + 1);
  const t = pos - lo;
  const a = _lerp(PAGE_VEIL[lo], PAGE_VEIL[hi], t);
  const c0 = _hexRGB(PAGE_BGS[lo]), c1 = _hexRGB(PAGE_BGS[hi]);
  const col = `rgb(${c0.map((x,i)=>Math.round(_lerp(x,c1[i],t))).join(",")})`;
  const body = document.body;
  body.classList.toggle("hasbgimg", !!img);
  if(img){
    body.style.background = "";
    body.style.backgroundColor = PAGE_BGS[0];
    body.style.backgroundImage = `linear-gradient(rgba(255,255,255,${a.toFixed(3)}),rgba(255,255,255,${a.toFixed(3)})), url('${img}')`;
    body.style.backgroundSize = "auto, cover";
    body.style.backgroundPosition = "center, center";
    body.style.backgroundRepeat = "no-repeat, no-repeat";
    body.style.backgroundAttachment = "fixed, fixed";
  }else{
    body.style.background = col;
    body.style.backgroundImage = "";
    body.style.backgroundSize = "";
    body.style.backgroundPosition = "";
    body.style.backgroundRepeat = "";
    body.style.backgroundAttachment = "";
  }
}
function bgShadeHTML(id, val){
  const v = bgShadeFromMeta(val);
  return `<span class="bgshade" title="背景深浅（连续调节）"><span>背景深浅</span><input type="range" id="${id}" min="0" max="100" step="0.5" value="${v}" aria-label="背景深浅"><span class="bgsv" id="${id}lab">${Math.round(v)}%</span></span>`;
}
function bindBgShade(cid, rangeId){
  const r = document.getElementById(rangeId);
  if(!r) return;
  const lab = document.getElementById(rangeId+"lab");
  r.oninput = ()=>{
    applyPageBg(CUR_BG_IMG, r.value);
    if(lab) lab.textContent = Math.round(+r.value) + "%";
  };
  r.onchange = ()=>api.setPageBg(cid, r.value);
}
let CUR_BG_IMG = null;   // 当前课堂底图, 供滑块连续调节时复用
// 底图守护: 切页/热词刷新/纯净模式退出等操作偶尔会把 body 背景覆盖掉,
// 这里定期检查, 发现底图丢了就补回(只在课堂页生效, 首页/课程页不要底图)
setInterval(()=>{
  if(!BG_KEEP) return;
  const body = document.body;
  if(!body.classList.contains("detail") && !body.classList.contains("live")) return;
  const cur = body.style.backgroundImage || "";
  if(cur.indexOf(BG_KEEP) >= 0) return;
  const rg = document.getElementById("pagebgr") || document.getElementById("livepagebgr");
  applyPageBg(BG_KEEP, rg ? rg.value : 0);
}, 1500);

function pvOpacityVal(cid){

function coverStyle(cv){

  return "";

function coverModal(kind, id, current, after){
  const wrap = document.createElement("div");
  wrap.className = "modalwrap";
  const sw = COVER_PRESETS.map(p=>
    `<div class="cvsw${current&&current.t==="preset"&&current.v===p.id?" on":""}" data-p="${p.id}" style="background-image:${p.bg}"><span>${p.name}</span></div>`).join("");
  wrap.innerHTML = `<div class="modalbox"><h3>设置卡片背景</h3>
    <p>选一个预设，或上传本地图片作为封面（自动裁成 16:9 并压缩后保存）。</p>

    <div class="row" style="justify-content:space-between;align-items:center">
      <button class="btn ghost" data-reset>恢复默认</button>
      <span style="display:flex;gap:8px">
        <button class="btn ghost" data-up>上传图片</button>
        <button class="btn ghost" data-c>取消</button>
      </span>
    </div>
    <input type="file" accept="image/*" style="display:none" data-inp>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>{ wrap.remove(); after(); };
  wrap.addEventListener("click", e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector("[data-c]").onclick = ()=>wrap.remove();
  wrap.querySelectorAll(".cvsw").forEach(el=>el.onclick = async ()=>{
    const r = await api.setCover(kind, id, {t:"preset", v: el.dataset.p});
    if(r && r.ok) close(); else alert("设置背景失败");
  });
  wrap.querySelector("[data-reset]").onclick = async ()=>{
    const r = await api.setCover(kind, id, null);
    if(r && r.ok) close(); else alert("恢复默认失败");
  };
  const inp = wrap.querySelector("[data-inp]");
  wrap.querySelector("[data-up]").onclick = ()=>inp.click();
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    if(!f.type.startsWith("image/")) return alert("请选择图片文件");
    if(f.size > 12*1024*1024) return alert("图片过大（请小于 12MB）");
    try{
      const up = await api.coverUpload(f);
      const r = await api.setCover(kind, id, {t:"img", u: up.url});
      if(r && r.ok) close(); else alert("保存封面失败");
    }catch(e){ alert("上传失败：" + (e.message || e)); }
  };
}

// ---------- 界面状态: localStorage + 服务端 .ui_state.json 双备份 ----------
// 桌面壳端口不固定, localStorage 按 origin 隔离, 端口一变就丢; 服务端为准, 本地快速回退。
const HOME_LIST_KEYS = ["cc_view_home_courses", "cc_view_home_classes", "cc_view_group_classes"];
const UI_STATE = {view_modes:{}, preview_files:{}, preview_pos:{}};
function uiStateSet(section, key, value){
  UI_STATE[section][key] = value;
  try{
    fetch("/api/ui/state",{method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({section,key,value}),keepalive:true}).catch(()=>{});
  }catch(e){}
}
async function uiStateLoad(){
  try{
    const s = await fetch("/api/ui/state").then(r=>r.json());
    Object.keys(UI_STATE).forEach(k=>{
      if(s[k] && typeof s[k]==="object") Object.assign(UI_STATE[k], s[k]);
    });
  }catch(e){}
  // 旧版「一个全局偏好控制所有列表」迁移成各列表独立值, 此后互不影响
  try{
    const legacy = localStorage.getItem("cc_view_mode");
    if(legacy){
      HOME_LIST_KEYS.forEach(k=>{
        if(!UI_STATE.view_modes[k] && localStorage.getItem(k) === null){
          localStorage.setItem(k, legacy);
          uiStateSet("view_modes", k, legacy);
        }
      });
      localStorage.removeItem("cc_view_mode");
    }
  }catch(e){}
}
// 条目/块视图: 每个列表只认自己的 key, 三处列表完全解耦
function viewMode(key){
  const v = UI_STATE.view_modes[key];
  if(v === "block" || v === "narrow") return v;
  return localStorage.getItem(key) === "narrow" ? "narrow" : "block";
}
function setViewMode(key, v){
  try{ localStorage.setItem(key, v); }catch(e){}
  uiStateSet("view_modes", key, v);
}
function viewToggleHTML(key){
  const cur = viewMode(key);
  const bon = cur==="block" ? "on" : "";
  const non = cur==="narrow" ? "on" : "";
  return `<div class="viewtoggle" data-vkey="${key}"><button data-v="block" class="${bon}" title="块视图（封面卡片）">▦</button><button data-v="narrow" class="${non}" title="窄视图（纯列表）">☰</button></div>`;
}

    const v = JSON.parse(localStorage.getItem(HOME_SEC_KEY)||"{}");
    return {courses: !!v.courses, classes: !!v.classes};
  }catch(e){ return {courses:false, classes:false}; }
}
function homeSaveSec(){
  try{ localStorage.setItem(HOME_SEC_KEY, JSON.stringify(homeCollapsedState)); }catch(e){}
}
function applyHomeCollapse(){
  document.querySelectorAll(".homesec").forEach(sec=>{
    const open = !!homeCollapsedState[sec.dataset.sec];
    const wrap = document.getElementById(sec.dataset.sec==="courses" ? "gwrap" : "cwrap");
    if(wrap) wrap.style.display = open ? "" : "none";
    sec.classList.toggle("collapsed", !open);
    const ar = sec.querySelector(".arrow"); if(ar) ar.textContent = open ? "收起" : "展开";
  });
}
function homeShowOnly(sec){
  homeCollapsedState = {courses: sec==="courses", classes: sec==="classes"};
  homeSaveSec();
  renderHome();
  window.scrollTo(0,0);
}

        : `<div class="grid">` + groups.map(g=>`
          <div class="course" data-gid="${g.id}" style="${coverStyle(g.cover)}">
            <div class="ccin">
              <h3>${esc(g.name)}</h3>
              <div class="meta">${g.class_count} 个课堂 · ${g.file_count||0} 个课程文件${g.id==="g_default"?" · 默认课程":""}</div>
              <div class="acts">
                <button class="btn ghost" data-act="files">课程文件</button>
                <button class="btn ghost" data-act="cover">背景</button>
                <button class="btn ghost" data-act="rename">改名</button>
                <button class="btn danger" data-act="del">删除</button></div>
            </div>
          </div>`).join("") + `</div>`)
    : `<div class="empty card">还没有课程，先新建一个 ↑</div>`;
  $("#glist").innerHTML = glistHTML;
  // 同时绑定块视图和窄视图的 onclick
  const bindGroupItem = el=>{
    const g = byId[el.dataset.gid];
    el.onclick = ()=>renderGroup(g.id);
    el.querySelectorAll("[data-act]").forEach(b=>b.onclick = async ev=>{
      ev.stopPropagation();
      if(b.dataset.act==="files") openCourseFilesModal(g.id, g.name, renderHome);
      else if(b.dataset.act==="cover") coverModal("group", g.id, g.cover, renderHome);
      else if(b.dataset.act==="rename"){
        const name = prompt("修改课程名称：", g.name);
        if(!name || !name.trim() || name.trim()===g.name) return;
        await api.groupRename(g.id, name.trim()); renderHome();

  document.querySelectorAll(".viewtoggle").forEach(vt=>{
    vt.onclick = ev=>{
      ev.stopPropagation();
    };

      b.onclick = ()=>{
        const key = vt.dataset.vkey;
        const v = b.dataset.v;
        setViewMode(key, v);
        // 记住滚动位置再重渲染, 切换视图不会跳回页首
        const sy = window.scrollY;
        renderHome().then(()=>window.scrollTo(0, sy));
      };
    });
  });

  const ab = $("#archiveBtn"); if(ab) ab.onclick = ()=>openArchiveModal();
  $("#gnew").onclick = async ()=>{
    const name = $("#gname").value.trim(); if(!name) return $("#gname").focus();

    const name = $("#cname").value.trim(); if(!name) return $("#cname").focus();
    const c = await api.create(name, $("#cgroup").value); renderCourse(c.id);
  };
}

// ---------- 课程页（某课程下的课堂列表） ----------

async function renderGroup(gid){
  document.body.classList.remove("live");
  document.body.classList.remove("detail");
  document.body.classList.remove("hasbgimg");
  document.body.style.background = "";
  const groups = await api.groups();
  const g = groups.find(x=>x.id===gid);
  if(!g){ homeShowOnly("courses"); return; }
  const list = await api.groupClasses(gid);
  const byId = {};
  groups.forEach(x=>byId[x.id]=x);
  const vkey = "cc_view_group_classes";
  const vmode = viewMode(vkey);
  const clistHTML = list.length
    ? (vmode==="narrow"
        ? `<div class="narrowlist">` + list.map(c=>narrowClassItem(c, g.name)).join("") + `</div>`
        : `<div class="grid">` + list.map(c=>classCard(c, g.name, false)).join("") + `</div>`)
    : `<div class="empty card">这个课程下还没有课堂，先新建一个 ↑</div>`;
  app.innerHTML = `<div class="crumbs" id="home">← 全部课程</div>
    <header><h1>${esc(g.name)}</h1><span class="badge b-ready">${list.length} 个课堂</span>
      <span style="flex:1"></span>
      ${viewToggleHTML(vkey)}
      <button class="btn ghost" id="gfiles">📁 课程文件${g.file_count?`（${g.file_count}）`:""}</button>
      <button class="btn ghost" id="gren">改名</button>
      <button class="btn danger" id="gdel">删除课程</button></header>
    <div class="newrow"><input type="text" id="cname" placeholder="在本课程下新建课堂，如：第3讲" maxlength="50">
      <button class="btn primary" id="cnew">＋ 新建课堂</button></div>
    <div id="clist">${clistHTML}</div>`;
  $("#home").onclick = ()=>homeShowOnly("courses");
  $("#gfiles").onclick = ()=>openCourseFilesModal(gid, g.name, ()=>renderGroup(gid));
  $("#gren").onclick = async ()=>{
    const name = prompt("修改课程名称：", g.name);
    if(!name || !name.trim() || name.trim()===g.name) return;
    await api.groupRename(gid, name.trim()); renderGroup(gid);
  };
  const gd = $("#gdel"); if(gd) gd.onclick = ()=>deleteGroup(g);
  $("#cnew").onclick = async ()=>{
    const name = $("#cname").value.trim(); if(!name) return $("#cname").focus();
    const c = await api.create(name, gid); renderCourse(c.id);
  };
  bindClassCards($("#clist"), groups, ()=>renderGroup(gid));
  // 窄视图 onclick
  $("#clist").querySelectorAll(".narrowitem[data-id]").forEach(el=>{
    const cid = el.dataset.id;
    el.onclick = ()=>renderCourse(cid);
    el.querySelectorAll("[data-act]").forEach(b=>b.onclick = ev=>{
      ev.stopPropagation();
      if(b.dataset.act==="move") moveClass(cid, groups, ()=>renderGroup(gid));
      else if(b.dataset.act==="del") delClass(cid, ()=>renderGroup(gid));
    });
  });
  // viewtoggle 绑定(每个列表只改自己的偏好并写服务端备份)
  document.querySelectorAll(".viewtoggle").forEach(vt=>{
    vt.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        const sy = window.scrollY;
        setViewMode(vt.dataset.vkey, b.dataset.v);
        renderGroup(gid).then(()=>window.scrollTo(0, sy));
      };
    });
  });
}

    const paint = (auds, st)=>{
      const pend = (st||[]).filter(x=>x.state==="synthesizing");
      const miss = (st||[]).filter(x=>x.state==="missing");
      const fail = (st||[]).filter(x=>x.state==="failed");
      const parts = [];
      if(auds.length) parts.push(`🎧 本课共 ${auds.length} 场录音，点下方「第 N 次上课」页签回放`);
      if(pend.length) parts.push(`<b style="color:#e8a33d">${pend.length} 场音频正在后台合成，完成后自动出现</b>`);
      if(miss.length) parts.push(`${miss.length} 场音频待生成`);
      if(fail.length) parts.push(`<span style="color:#e06">${fail.length} 场音频合成失败：${esc(String(fail[0].error||"未知原因").slice(0,120))}</span>`);
      if(ac){ ac.style.display = auds.length ? "" : "none"; ac.textContent = auds.length + " 场录音"; }
      al.style.display = parts.length ? "block" : "none";
      al.innerHTML = parts.length ? `<div class="hint">${parts.join(" · ")}</div>` : "";
    };
    let auds = await fetch(`/api/courses/${id}/audios`).then(r=>r.json());
    let st = await fetch(`/api/courses/${id}/audio_status`).then(r=>r.json()).catch(()=>[]);
    paint(auds, st);
    // 刚下课时 mp3 由后台线程合成: 一直等到本场就绪或失败(最多约 3 分钟), 别只等十几秒
    if(waitSid != null){
      let seen = auds.length;
      for(let i=0;i<150;i++){
        const row = (st||[]).find(x=>x.sid===waitSid);
        if(row && (row.state==="ready" || row.state==="failed")) break;
        await new Promise(r=>setTimeout(r,1200));
        if(!document.body.contains(al)) return;
        st = await fetch(`/api/courses/${id}/audio_status`).then(r=>r.json()).catch(()=>st);
        auds = await fetch(`/api/courses/${id}/audios`).then(r=>r.json());
        paint(auds, st);
        if(auds.length>seen){ seen = auds.length; renderRaw(); }
      }
      if(auds.length>seen) renderRaw();
      const row = (st||[]).find(x=>x.sid===waitSid);
      if(row && row.state==="failed") ccToast("本次录音音频合成失败：" + (row.error||"未知原因"));
      else if(row && row.state==="ready") ccToast("本次录音音频已生成");
    }
  })();
  // 整理/转写进行中: 顶部小横幅轮询(不占整页)
  if(["transcribing","organizing"].includes(c.status)) pollBanner(id);
}
function pollBanner(id){
  const t = setInterval(async ()=>{
    const m = await api.get(id);
    const b = $("#banner"); if(!b){ clearInterval(t); return; }
    if(["transcribing","organizing"].includes(m.status)){
      b.innerHTML = `<div class="banner"><div class="spin" style="width:16px;height:16px;margin:0"></div>
        ${m.status==="transcribing"?`正在转写录音 ${m.progress||""}… 完成后可在「整理讲稿」里一键整理`:"AI 正在对照 PPT 整理讲稿…"}</div>`;
    } else { clearInterval(t); renderCourse(id); }
  }, 4000);
}

// ---------- 录音会话: 独立于视图运行, 退出上课页后继续录/转写/要点 ----------
let REC = null;
const REC_HB = "cc_rec_hb";
const fmtClock = s => `${String(Math.floor((s||0)/60)).padStart(2,"0")}:${String((s||0)%60).padStart(2,"0")}`;
function recHeartbeat(){ if(!REC) return; try{ localStorage.setItem(REC_HB, JSON.stringify({cid:REC.cid,sid:REC.sid,ts:Date.now()})); }catch(e){} }
function recClearHeartbeat(){ try{ localStorage.removeItem(REC_HB); }catch(e){} }
function recBarSync(){
  const bar = $("#livebar"); if(!bar) return;
  const on = !!(REC && REC.started && !REC.stopping &&
    !(document.body.classList.contains("live") && REC.viewCid===REC.cid));

  const tm = bar.querySelector(".lbtime"); if(tm) tm.textContent = fmtClock(REC.secs);
}
function recPauseLabel(){

  b.className = "btn " + (paused ? (started ? "warnb" : "primary") : "warnb");
  b.textContent = paused ? (started ? "▶ 继续" : "▶ 开始上课") : "⏸ 暂停";
  const dot = $("#rdot"); if(dot) dot.classList.toggle("paused", paused || !started);
  const info = $("#chunkinfo");

    (paused ? "已暂停（计时停止，不采集音频）" : "流式转写中 · 每100秒自动整理要点");
  const stop = $("#stop"); if(stop) stop.disabled = !started;
  const t = $("#timer"); if(t && REC) t.textContent = fmtClock(REC.secs);

function recRenderCaptions(){

    return;

function recRenderNotes(){

  if(el) el.innerHTML = REC.notesHtml || '<span class="hint">本节课的要点会在这里实时生成…</span>';
  const st = $("#orgstat"); if(st) st.textContent = REC.notesStat || "";
}
function recAttachView(){
  if(!REC){ recBarSync(); return; }
  REC.viewCid = REC.cid;
  recPauseLabel(); recRenderCaptions(); recRenderNotes(); recBarSync();
  const a = $("#tgAsr"); if(a){ a.classList.toggle("on", REC.asrOn); a.textContent = REC.asrOn ? "实时转写 ✓" : "实时转写 ✕"; }

  const t = $("#timer"); if(t) t.textContent = fmtClock(REC.secs);

async function recCreate(id){
  if(REC) return REC;
  const c = await api.get(id);
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}}); }
  catch(e){ throw new Error("麦克风不可用: " + (e.message||e.name)); }
  let j;
  try{ j = await api.begin(id); }
  catch(e){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(_){} throw new Error("开始上课失败: " + (e.message||e.name)); }
  const pre = aiCtx(id);
  const rec = {cid:id, sid:j.sid, cname:c.name, sessNo:j.sid+1, started:false, paused:true, secs:0,
    wallStart: Date.now(), stream, actx:null, proc:null, recorder:null, chunkIdx:0, segIdx:0,
    livePending:0, pendingChunks:0, pcmBuf:[], asrOn:true, sumOn:true, organizing:false,
    captions:[], notesHtml:"", notesStat:"", chat:pre.chat, lvTab:"1", timers:[], raf:0,
    viewCid:null, stopping:false, vu:0};

  REC = rec;
  try{
    rec.bc = new BroadcastChannel("cc_rec");
    rec.bc.onmessage = ev=>{
      const d = ev.data || {};
      if(d.type === "ping" && d.cid === rec.cid) rec.bc.postMessage({type:"pong", cid:rec.cid});
    };
  }catch(e){}
  try{
    // 直接按 16k 建上下文: 浏览器内部做带抗混叠的重采样, 避免手写降采样把超声折叠成 6.6k 哨音
    let actx;
    try{ actx = new AudioContext({sampleRate:16000}); }
    catch(e){ actx = new AudioContext(); }
    rec.actx = actx;
    rec.actx.resume().catch(()=>{});
    const src = rec.actx.createMediaStreamSource(stream);
    const an = rec.actx.createAnalyser(); an.fftSize = 512; src.connect(an);
    const vbuf = new Uint8Array(an.frequencyBinCount);
    const vuLoop = ()=>{
      if(!REC || REC !== rec) return;
      an.getByteFrequencyData(vbuf);
      rec.vu = (rec.started && !rec.paused && !rec.stopping) ? Math.min(100, vbuf.reduce((a,b)=>a+b,0)/vbuf.length*2.2) : 0;
      const bar = $("#vubar"); if(bar && document.body.classList.contains("live")) bar.style.width = rec.vu + "%";
      rec.raf = requestAnimationFrame(vuLoop);
    };
    rec.raf = requestAnimationFrame(vuLoop);
    const ratio = rec.actx.sampleRate / 16000;
    let tap = src;
    if(Math.abs(ratio - 1) > 1e-6){
      // 浏览器没按 16k 建上下文时的兜底: 先 7k 低通抗混叠, 再线性插值降采样
      const lp = rec.actx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = Math.min(7000, rec.actx.sampleRate * 0.45);
      lp.Q.value = 0.707;
      src.connect(lp); tap = lp;
    }
    rec.proc = rec.actx.createScriptProcessor(4096,1,1);
    rec.proc.onaudioprocess = e=>{
      if(!REC || REC !== rec || !rec.started || rec.paused || rec.stopping) return;
      const raw = e.inputBuffer.getChannelData(0);
      const out = new Float32Array(Math.floor(raw.length/ratio));
      for(let i=0;i<out.length;i++){ const p=i*ratio, i0=Math.floor(p), frac=p-i0;
        out[i] = i0+1<raw.length ? raw[i0]*(1-frac)+raw[i0+1]*frac : raw[i0]; }
      rec.pcmBuf.push(out);
    };
    // ScriptProcessor 需要连到 destination 才会回调; 经 0 增益节点断开外放回路, 避免回声/反馈
    const sink = rec.actx.createGain(); sink.gain.value = 0;
    tap.connect(rec.proc); rec.proc.connect(sink); sink.connect(rec.actx.destination);
    rec.recorder = new MediaRecorder(stream,{mimeType:"audio/webm;codecs=opus",audioBitsPerSecond:96000});
    rec.recorder.ondataavailable = e=>{
      // 下课瞬间 REC 已被清空, 最后一块仍必须上传, 否则短课堂没有可用的 48k webm 源
      if(!e.data.size) return;
      rec.pendingChunks++;
      api.chunk(rec.cid, rec.sid, rec.chunkIdx++, e.data).finally(()=>{ rec.pendingChunks--; });
    };
    rec.recorder.onstop = ()=>{ if(REC===rec && rec.started && !rec.paused && !rec.stopping){ try{ rec.recorder.start(); }catch(e){} } };
  }catch(e){
    try{ stream.getTracks().forEach(t=>t.stop()); }catch(_){}
    REC = null;
    throw e;
  }
  rec.timers.push(setInterval(()=>{
    if(!REC || REC!==rec) return;
    if(rec.started && !rec.paused) rec.secs++;
    const t = $("#timer"); if(t && document.body.classList.contains("live")) t.textContent = fmtClock(rec.secs);
    recBarSync();
  },1000));
  rec.timers.push(setInterval(()=>{ if(REC===rec && rec.started && !rec.paused && rec.asrOn) recFlushSegment(); },20000));
  // 额外心跳: 定时器在后台标签页会被节流, 用上传动作顺带刷新心跳, 让后台巡检不会误判下课
  rec.timers.push(setInterval(()=>{ if(REC===rec && rec.started && !rec.paused) recHeartbeat(); },20000));
  rec.timers.push(setInterval(()=>{ if(REC===rec && rec.started && !rec.paused && rec.recorder.state==="recording"){ try{ rec.recorder.stop(); }catch(e){} } },60000));
  rec.timers.push(setInterval(()=>{ if(REC===rec && rec.started && !rec.paused && rec.sumOn && rec.segIdx>0 && rec.segIdx%5===0) recOrganize(true); },20000));
  rec.timers.push(setInterval(recHeartbeat,5000));
  recHeartbeat();
  return rec;
}
async function recFlushSegment(){
  const rec = REC; if(!rec || !rec.pcmBuf.length) return;
  const all = rec.pcmBuf; rec.pcmBuf = [];
  const total = all.reduce((n,a)=>n+a.length,0);
  if(total < 1600) return;
  const f32 = new Float32Array(total); let off = 0;
  for(const a of all){ f32.set(a,off); off += a.length; }
  const s16 = new Int16Array(total);
  for(let i=0;i<total;i++){ const v = Math.max(-1,Math.min(1,f32[i])); s16[i] = v<0 ? v*32768 : v*32767; }
  const start = rec.segIdx*20; rec.segIdx++;
  rec.livePending++;
  try{
    const wt = new Date(rec.wallStart + start*1000);
    const w = `${String(wt.getHours()).padStart(2,"0")}:${String(wt.getMinutes()).padStart(2,"0")}`;
    const r = await fetch(`/api/courses/${rec.cid}/live/${rec.sid}/${start}?w=${w}`,{method:"POST",body:s16.buffer});
    const j = await r.json();
    if(j.text && !rec.captions.some(x=>x.start===start)){
      rec.captions.push({start, text:j.text, wall:w});
      rec.captions.sort((a,b)=>a.start-b.start);
      recRenderCaptions();
    }
  }catch(e){} finally{ rec.livePending--; }
}
async function recOrganize(auto){
  const rec = REC; if(!rec || rec.organizing) return;
  rec.organizing = true;
  const st0 = $("#orgstat"); if(st0 && !rec.notesHtml) st0.textContent = auto ? "自动整理中…" : "整理中…";
  try{
    const r = await fetch(`/api/courses/${rec.cid}/live_organize`,{method:"POST"});
    const ct = r.headers.get("content-type") || "";
    const j = ct.includes("json") ? await r.json() : {};
    if(r.ok && j.notes){
      // 后端出错时会回传上一版要点并带 error, 此时只提示状态, 保留上一版内容
      rec.notesHtml = md(j.notes);
      rec.notesStat = j.error ? "本次未更新，显示上一版（" + String(j.error).slice(0, 40) + "）"
                              : "已更新 " + new Date().toLocaleTimeString();
    }
    else if(r.ok){ rec.notesStat = auto ? "" : "暂无要点"; }
    else { rec.notesStat = "要点接口不可用 (" + r.status + ")"; }
  }catch(e){ rec.notesStat = "整理失败"; }
  rec.organizing = false;
  recRenderNotes();
}
async function recPause(id){
  if(!REC){
    try{ await recCreate(id); }
    catch(e){ const i=$("#chunkinfo"); if(i) i.textContent = e.message; return; }
    const sess = $("#sessno"); if(sess) sess.textContent = "第 " + REC.sessNo + " 次上课";
    recAttachView();
  }
  if(REC.started){
    if(REC.paused){
      REC.paused = false;
      try{ REC.actx && REC.actx.resume(); }catch(e){}
      try{ if(REC.recorder.state !== "recording") REC.recorder.start(); }catch(e){}
    }else{
      REC.paused = true;
      try{ if(REC.recorder.state === "recording") REC.recorder.stop(); }catch(e){}
    }
  }else{
    REC.started = true; REC.paused = false;
    try{ REC.actx && REC.actx.resume(); }catch(e){}
    try{ REC.recorder.start(); }catch(e){}
  }
  recPauseLabel(); recBarSync(); recHeartbeat();
}
async function recStop(id){
  const rec = REC;
  if(!rec || rec.cid !== id || !rec.started){ renderCourse(id); return; }
  rec.stopping = true;
  const btn = $("#stop"); if(btn) btn.disabled = true;
  const info = $("#chunkinfo"); if(info) info.textContent = "正在保存…";
  rec.viewCid = null; recBarSync();
  await recFlushSegment();
  // 先停 MediaRecorder 触发最后一块 webm 的 dataavailable, 再等它上传完成,
  // 否则合成 mp3 时可能缺最后一段(短课堂会整段没有 webm)
  try{ if(rec.recorder && rec.recorder.state !== "inactive") rec.recorder.stop(); }catch(e){}
  await new Promise(r=>setTimeout(r, 500));   // 等最后一块 dataavailable 触发
  const deadline = Date.now() + 12000;
  while((rec.livePending > 0 || rec.pendingChunks > 0) && Date.now() < deadline) await new Promise(r=>setTimeout(r,300));
  await recDestroy();
  // 下课后直接落在「录音原稿」页签: 本场录音与历史录音都在那里可回放
  try{ localStorage.setItem("cc_tab", "raw"); }catch(e){}
  renderCourse(id, rec ? rec.sid : null);   // 等本场 mp3 生成后再显示录音列表
}
async function recDestroy(){
  const rec = REC; if(!rec) return;
  REC = null; recClearHeartbeat();
  for(const t of rec.timers){ try{ clearInterval(t); }catch(e){} }
  try{ cancelAnimationFrame(rec.raf); }catch(e){}
  try{ rec.proc && rec.proc.disconnect(); }catch(e){}
  try{ if(rec.recorder && rec.recorder.state !== "inactive") rec.recorder.stop(); }catch(e){}
  try{ rec.stream && rec.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ rec.actx && rec.actx.close(); }catch(e){}
  try{ rec.bc && rec.bc.close(); }catch(e){}
  try{ await api.stop(rec.cid, rec.sid); }catch(e){}
  recBarSync();
}
window.addEventListener("beforeunload", ()=>{
  if(REC && REC.started){
    const rec = REC;
    try{ navigator.sendBeacon(`/api/courses/${rec.cid}/stop/${rec.sid}`); }catch(e){}
    recClearHeartbeat();
  }
});
// 启动时清掉"界面显示录音中、实际已无录音"的残留会话。
// localStorage 心跳在同源多标签页间共享, 无法区分"另一个标签正在录"和"上次异常退出留下的旧心跳",
// 因此优先用 BroadcastChannel 现场询问: 有页面应答 pong 说明录音确实还活着。
async function recAlive(cid){
  if(!("BroadcastChannel" in window)) return null;
  let bc;
  try{ bc = new BroadcastChannel("cc_rec"); }catch(e){ return null; }
  const alive = await new Promise(res=>{
    let got = false;
    bc.onmessage = ev=>{ const d = ev.data || {}; if(d.type === "pong" && d.cid === cid) got = true; };
    bc.postMessage({type:"ping", cid});
    setTimeout(()=>res(got), 450);
  });
  try{ bc.close(); }catch(e){}
  return alive;
}
async function recSweepStale(){
  try{
    const list = await api.list();
    for(const c of list){
      if(c.status !== "recording") continue;
      if(REC && REC.cid === c.id) continue;
      const alive = await recAlive(c.id);
      if(alive) continue;
      if(alive === null){
        let hb = null; try{ hb = JSON.parse(localStorage.getItem(REC_HB) || "null"); }catch(e){}
        // 心跳阈值必须大于浏览器后台标签页的定时器节流间隔(>=60s),
        // 否则切到别的窗口一会儿就会被误判成"课上完了"而自动下课
        if(hb && hb.cid === c.id && Date.now() - (hb.ts||0) < 120000) continue;
      }
      const m = await api.get(c.id);
      const open = [...(m.sessions||[])].reverse().find(s=>!s.ended);
      if(open){ try{ await api.stop(c.id, open.sid); }catch(e){} }
    }
  }catch(e){}
}

// ---------- AI 问答: 共享会话 + 可呼出浮窗(上课/下课都可用) ----------
const AI_CHAT = new Map(), AI_LOGS = new Map();
let AI_CID = null, AI_NAME = "", AI_FLOAT_CID = null;
const AI_UI_KEY = "cc_ai_float", AI_WEB_KEY = "cc_ai_web";

try{ AI_WEB = localStorage.getItem(AI_WEB_KEY) === "1"; }catch(e){}

function aiSave(){ try{ localStorage.setItem(AI_UI_KEY, JSON.stringify(AI_UI)); }catch(e){} }
function aiCtx(cid){
  if(!AI_CHAT.has(cid)) AI_CHAT.set(cid, {cid, chat:[], busy:false, waiting:false, lastLat:"", loaded:false, loading:false});
  return AI_CHAT.get(cid);
}
async function aiLoad(cid){
  const ctx = aiCtx(cid);
  if(ctx.loading || ctx.loaded) return;
  ctx.loading = true;
  try{
    const j = await api.chatGet(cid);
    if(!ctx.chat.length && Array.isArray(j.messages)) ctx.chat = j.messages;
  }catch(e){}
  ctx.loading = false; ctx.loaded = true;
  aiDraw(cid);
}
function aiPersist(cid){
  const ctx = aiCtx(cid);
  try{
    api.chatSave(cid, ctx.chat.map(m=>({role:m.role, content:m.content||"",
      notice:m.notice||"", sources:m.sources||[]}))).catch(()=>{});
  }catch(e){}
}
function aiReg(cid, el){
  if(!el) return;
  if(!AI_LOGS.has(cid)) AI_LOGS.set(cid, new Set());
  AI_LOGS.get(cid).add(el);
}
function aiUnreg(cid, el){
  const s = cid==null ? null : AI_LOGS.get(cid);
  if(s){ s.delete(el); if(!s.size) AI_LOGS.delete(cid); }
}
function aiDraw(cid){
  const ctx = aiCtx(cid), set = AI_LOGS.get(cid);
  if(set) for(const log of [...set]){
    if(!log.isConnected){ set.delete(log); continue; }
    log.innerHTML = (ctx.chat.length ? ctx.chat.map(m=> m.role==="user"
      ? `<p style="margin:6px 0"><b>我：</b>${esc(m.content)}</p>`
      : `<p style="margin:6px 0"><b style="color:var(--acc)">AI：</b>${m.notice?`<span style="color:var(--warn)">⚠️ ${esc(m.notice)}</span><br>`:""}${md(m.content)}</p>`
        + (m.sources && m.sources.length ? `<p style="margin:2px 0 6px;font-size:11.5px;color:var(--sub)">来源：${m.sources.map((s,i)=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">[${i+1}] ${esc(s.title)}</a>`).join(" · ")}</p>` : "")).join("")
      : '<div class="hint">问我任何与本节课相关的问题（会让你看到本场实时字幕、PPT 和讲稿）</div>')
      + (ctx.waiting ? `<p class="hint" style="margin:6px 0">${ctx.searching?"🔎 正在联网搜索…":"思考中…"}</p>` : "");
    log.scrollTop = log.scrollHeight;
  }
  const lat = $("#ailat");
  if(lat && AI_CID === cid) lat.textContent = ctx.lastLat || "";
}
async function aiAsk(cid, q){
  const ctx = aiCtx(cid); q = String(q||"").trim();
  if(ctx.busy || !q) return;
  const web = AI_WEB;   // 手动勾选=强制联网; 未勾选时由模型通过 web_search 工具自主决定
  ctx.busy = true; ctx.waiting = true; ctx.searching = web;
  ctx.chat.push({role:"user", content:q});
  aiDraw(cid);
  const t0 = performance.now();
  try{
    const r = await fetch(`/api/courses/${cid}/chat`, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({messages: ctx.chat.slice(-10), web})});
    const j = await r.json();
    const dt = ((performance.now()-t0)/1000).toFixed(1);
    ctx.chat.push({role:"assistant", content: j.answer || ("出错: "+(j.error||"")),
                   notice: j.notice || "", sources: j.sources || []});
    const sc = (j.search && j.search.used) ? (j.search.status === "ok" ? `已联网 ${j.search.count} 条` : "未联网") : "未联网";
    ctx.lastLat = `本次耗时 ${dt}s · ${sc} · sensenova-6.8-flash-lite`;
  }catch(e){
    ctx.chat.push({role:"assistant", content:"请求失败"});
  }
  ctx.waiting = false; ctx.searching = false; ctx.busy = false;
  aiDraw(cid);
  aiPersist(cid);
}
const AI_MIN_W = 320, AI_MIN_H = 260;
function aiApply(){
  const p = $("#aifloat"); if(!p) return;
  const w = Math.max(AI_MIN_W, Math.min(AI_UI.w || 380, innerWidth - 16));
  const h = Math.max(AI_MIN_H, Math.min(AI_UI.h || 460, innerHeight - 16));
  AI_UI.w = w; AI_UI.h = h;
  p.style.width = w + "px"; p.style.height = h + "px";
  let x = AI_UI.x, y = AI_UI.y;
  if(x == null || y == null){ x = innerWidth - w - 18; y = innerHeight - h - 18; }
  x = Math.max(4, Math.min(x, innerWidth - w - 4));
  y = Math.max(4, Math.min(y, innerHeight - h - 4));
  AI_UI.x = x; AI_UI.y = y;
  p.style.left = x + "px"; p.style.top = y + "px";
  p.style.opacity = (parseFloat(AI_UI.op) || 92) / 100;
  const op = $("#aiopacity"); if(op) op.value = AI_UI.op;
  const opv = $("#aiopv"); if(opv) opv.textContent = Math.round(parseFloat(AI_UI.op) || 92) + "%";
}
function aiFloatSync(cid, name){
  const fab = $("#aifab"), p = $("#aifloat"); if(!fab || !p) return;
  if(cid){ AI_CID = cid; if(name) AI_NAME = name; }
  const show = !!(AI_CID && (document.body.classList.contains("live") || document.body.classList.contains("detail")));
  fab.style.display = show ? "flex" : "none";
  if(!show){ p.style.display = "none"; return; }
  const ctxEl = $("#aictx"); if(ctxEl) ctxEl.textContent = AI_NAME || "";
  const log = $("#aichatlog");
  if(AI_FLOAT_CID && (!AI_UI.open || AI_FLOAT_CID !== AI_CID)) aiUnreg(AI_FLOAT_CID, log);
  p.style.display = AI_UI.open ? "flex" : "none";
  if(AI_UI.open){
    aiApply();
    aiLoad(AI_CID);
    aiReg(AI_CID, log); AI_FLOAT_CID = AI_CID;
    aiDraw(AI_CID);
  } else AI_FLOAT_CID = null;
}
function aiFloatHide(){
  AI_CID = null;
  const fab = $("#aifab"), p = $("#aifloat");
  if(fab) fab.style.display = "none";
  if(p) p.style.display = "none";
  if(AI_FLOAT_CID){ aiUnreg(AI_FLOAT_CID, $("#aichatlog")); AI_FLOAT_CID = null; }
}
function aiFloatToggle(force){
  AI_UI.open = (typeof force === "boolean") ? force : !AI_UI.open;
  aiSave();
  aiFloatSync();
}
(function bindAiFloat(){
  const p = $("#aifloat"), head = $("#aidrag");
  if(!p || !head) return;
  const fab = $("#aifab");
  if(fab) fab.onclick = ()=>aiFloatToggle();
  const closeb = $("#aiclose"); if(closeb) closeb.onclick = ()=>aiFloatToggle(false);
  const clearb = $("#aiclear");
  if(clearb) clearb.onclick = async ()=>{
    if(!AI_CID) return;
    if(!confirm("清空当前显示的 AI 问答？\n\n原会话会先自动留档到 课程库/<课程>/<课堂>/AI问答/历史，不会删除。")) return;
    try{ await api.chatClear(AI_CID); }catch(e){}
    const ctx = aiCtx(AI_CID);
    ctx.chat = []; ctx.loaded = true;
    aiDraw(AI_CID);
    ccToast("已清空当前会话，历史已留档");
  };
  const web = $("#aiweb");
  if(web){
    web.checked = AI_WEB;
    web.onchange = ()=>{ AI_WEB = web.checked;
      try{ localStorage.setItem(AI_WEB_KEY, AI_WEB ? "1" : "0"); }catch(e){} };
  }
  const op = $("#aiopacity");
  if(op) op.oninput = ()=>{
    AI_UI.op = parseFloat(op.value);
    p.style.opacity = AI_UI.op / 100;
    const opv = $("#aiopv"); if(opv) opv.textContent = Math.round(AI_UI.op) + "%";
    aiSave();
  };
  const send = $("#aisend"), inp = $("#aiinput");
  const go = ()=>{ const q = inp.value.trim(); if(!q || !AI_CID) return; inp.value=""; aiAsk(AI_CID, q); };
  if(send) send.onclick = go;
  if(inp) inp.onkeydown = e=>{ if(e.key==="Enter") go(); };
  let drag = null, rz = null;
  head.addEventListener("mousedown", e=>{
    if(e.target.closest("button")) return;
    drag = {dx:e.clientX-(AI_UI.x||0), dy:e.clientY-(AI_UI.y||0)};
    e.preventDefault();
  });
  // 四边 + 四角都能拉伸: dir 里的 e/s 改右/下边, w/n 改左/上边(同时平移窗口)
  p.querySelectorAll(".airz").forEach(h=>h.addEventListener("mousedown", e=>{
    e.preventDefault(); e.stopPropagation();
    rz = {dir:h.dataset.rz, x:e.clientX, y:e.clientY,
          x0:AI_UI.x||0, y0:AI_UI.y||0, w:p.offsetWidth, h:p.offsetHeight};
  }));
  document.addEventListener("mousemove", e=>{
    if(drag){
      AI_UI.x = Math.max(0, Math.min(e.clientX-drag.dx, innerWidth-p.offsetWidth));
      AI_UI.y = Math.max(0, Math.min(e.clientY-drag.dy, innerHeight-p.offsetHeight));
      p.style.left = AI_UI.x+"px"; p.style.top = AI_UI.y+"px";
    } else if(rz){
      const dx = e.clientX-rz.x, dy = e.clientY-rz.y, d = rz.dir;
      let x = rz.x0, y = rz.y0, w = rz.w, h = rz.h;
      if(d.includes("e")) w = Math.max(AI_MIN_W, Math.min(rz.w+dx, innerWidth-rz.x0-4));
      if(d.includes("s")) h = Math.max(AI_MIN_H, Math.min(rz.h+dy, innerHeight-rz.y0-4));
      if(d.includes("w")){ w = Math.max(AI_MIN_W, Math.min(rz.w-dx, rz.x0+rz.w-4)); x = rz.x0+rz.w-w; }
      if(d.includes("n")){ h = Math.max(AI_MIN_H, Math.min(rz.h-dy, rz.y0+rz.h-4)); y = rz.y0+rz.h-h; }
      AI_UI.x = x; AI_UI.y = y; AI_UI.w = w; AI_UI.h = h;
      aiApply();
    }
  });
  document.addEventListener("mouseup", ()=>{
    if(drag){
      drag = null;
      if(AI_UI.x < 24) AI_UI.x = 8;
      else if(AI_UI.x + p.offsetWidth > innerWidth-24) AI_UI.x = innerWidth - p.offsetWidth - 8;
      p.style.left = AI_UI.x+"px"; aiSave();
    }
    if(rz){ rz = null; aiSave(); }
  });
  window.addEventListener("resize", ()=>{ if(AI_UI.open) aiApply(); });
  document.addEventListener("click", e=>{
    const bp = $("#pagebgpanel");
    if(bp && bp.style.display !== "none" && !e.target.closest(".bgwrap")) bp.style.display = "none";
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ const bp=$("#pagebgpanel"); if(bp) bp.style.display="none"; } });
})();

  bindBgShade(id, "livepagebgr");

  const preferFid = pvFilePref(id, "live");
  bindPvOpacity(id);
  await renderPreview(document.getElementById("pptpages"), id, preferFid, "class", "live");
  initPptCol(document.getElementById("pptpages"), $("#ocrbtn"));
  const fb = $("#filesBtn"); if(fb) fb.onclick = ()=>openFilesModal(id);
  const pkb = $("#pickFileBtn"); if(pkb) pkb.onclick = ()=>openFilesModal(id, {pickOnly:true});
  $("#zfit").onclick = ()=>zoomFit();

  // 三栏独立折叠: 左/右折叠按钮贴各自边缘, 预览折叠按钮在栏眉正中,
  // 折叠后的展开按钮贴边缘(预览贴下边缘中间), 三栏全收起也能逐一展开。
  function applyLiveCols(u){
    u = u || liveLoadCols(CK);
    const st = liveStateFrom(u), cols = $("#cols");
    if(!cols) return;
    cols.className = "cols " + st;
    const L = $("#colL"), C = $("#colC"), R = $("#colR");
    if(L) L.style.display = u.l ? "flex" : "none";
    if(C) C.style.display = u.c ? "flex" : "none";
    if(R) R.style.display = u.r ? "" : "none";
    const efL = $("#efL"), efR = $("#efR"), efC = $("#efC"), tglC = $("#tglC"), em = $("#liveEmpty");
    if(efL){ efL.textContent = u.l ? "◀" : "▶"; efL.title = u.l ? "收起转写栏" : "展开转写栏"; }
    if(efR){ efR.textContent = u.r ? "▶" : "◀"; efR.title = u.r ? "收起笔记栏" : "展开笔记栏"; }
    if(efC) efC.style.display = u.c ? "none" : "";
    if(tglC) tglC.style.display = u.c ? "" : "none";
    if(em) em.style.display = st === "n" ? "" : "none";
    if(st !== "n" && PURE_MODE) setPure(false);
    if(u.r){
      const nm = $("#nedmount");
      if(nm && !nm.dataset.noteInit){ nm.dataset.noteInit = "1"; notesEditor(nm, id); }
    }
    if(u.c) applyZoom();
    if(liveColUI){ liveColUI.apply(); liveColUI.build(); liveColUI.position(); }
  }
  function toggleLive(side){
    const u = liveLoadCols(CK); u[side] = !u[side];
    // 折叠中间栏后, 剩下的左右栏默认各占一半: 丢掉本课堂 lr 状态的历史拖拽比例
    if(side === "c" && !u.c && u.l && u.r){
      try{ const s = colLoad(WK, {}); delete s.lr; colSave(WK, s); }catch(e){}
    }
    liveSaveCols(CK, u);
    applyLiveCols(u);   // 纯显隐切换, 不重建 DOM: 录音 / 字幕 / 笔记内容都保留
  }
  [["efL","l"],["efR","r"],["efC","c"],["tglC","c"]].forEach(([bid,side])=>{
    const b = $("#"+bid); if(b) b.onclick = ()=>toggleLive(side);
  });
  applyLiveCols(open);
  if(rec) recAttachView();
  else { recPauseLabel(); recBarSync(); }
}


// 先把服务端备份的界面状态读回来, 再渲染首页(否则首屏会用错视图/预览文件)
uiStateLoad().finally(()=>recSweepStale().finally(()=>renderHome(true)));
</script>
</body>
</html>
